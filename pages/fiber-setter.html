        <div class="flow-num" style="background:linear-gradient(135deg,#ff9500,#ffcc00);">A</div>
        <h4>"I've had Century Link for 30 years"</h4>
        <p>→ "Totally understand — what made you sign up with Century Link in the first place? Do you remember?" <em>(acknowledge + move forward with a question)</em></p>
      </div>
      <div class="flow-step" style="border-left:4px solid #ff9500;">
        <div class="flow-num" style="background:linear-gradient(135deg,#ff9500,#ffcc00);">B</div>
        <h4>"I'm busy"</h4>
        <p>→ "Yeah, totally understand. This is pretty surface level —" then ask a question and keep moving into the pitch.</p>
      </div>
      <div class="flow-step" style="border-left:4px solid #ff9500;">
        <div class="flow-num" style="background:linear-gradient(135deg,#ff9500,#ffcc00);">C</div>
        <h4>"I still in contract"</h4>
        <p>→ "Gotcha — how long do you have left on your contract?" <em>(gathering info, not defending)</em></p>
      </div>
    </div>

    <div class="section-tag" style="color:#ff9500;background:rgba(255,149,0,0.08);">The Key Distinction</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 10px;">Smoke Screen vs. Real Concern</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">A smoke screen gets thrown out once, casually, as a reflex. If the customer brings it up <strong>again</strong> with more specificity and urgency, it's escalating out of smoke screen territory and into something that needs to be handled differently.</p>

    <h3 style="font-size:18px;color:#1d1d1f;margin:0 0 14px;">Example — "I'm Busy"</h3>
    <div class="dd-grid">
      <div class="dd-col do" style="border-left:4px solid #ff9500;">
        <h4 style="color:#ff9500;">First time — Smoke screen</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:0 0 10px;border:none;"><em>"Hey man, I'm really busy today. Now's not a great time."</em></li>
          <li style="padding:0;border:none;">→ Acknowledge lightly: <em>"Yeah, totally understand — this is pretty surface level,"</em> then ask a question and keep moving into the pitch.</li>
        </ul>
      </div>
      <div class="dd-col dont">
        <h4>Second time — Now it's real</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:0 0 10px;border:none;"><em>"No, seriously man, I'm at a job site right now. I gotta go."</em></li>
          <li style="padding:0;border:none;">→ No longer a smoke screen. Repeated with real context + urgency. Now it's an objection — offer a callback.</li>
        </ul>
      </div>
    </div>

    <div class="pull-quote">
      The customer will tell you when something actually matters to them — they'll bring it back. Your job is not to be the one who makes it matter before they do.
      <cite>— The smoke-screen rule</cite>
    </div>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:6px;">As a setter, the vast majority of what you'll deal with is smoke screens. Get comfortable moving past them quickly, and you'll notice your conversations get longer and your sets get stronger.</p>
  `;
    }

    function renderObjectionsPage() {
      const content = document.getElementById('content');
      content.innerHTML = `
    <div class="sec-hero" style="background:linear-gradient(135deg,#ff3b30 0%,#ff6961 100%);box-shadow:0 8px 30px rgba(255,59,48,0.25);">
      <div class="crumb">The Pitch · Handling Objections · Objections</div>
      <span class="sec-tag">Real Barriers To The Sale</span>
      <h1>Objections</h1>
      <p class="lead">Objections are where deals die — but more often than not, the deal was actually lost in the moments <em>leading up to</em> the objection. Most objections are avoidable. The ones that aren't need to be handled with a specific method.</p>
    </div>

    <div class="insight-card" style="--accent:#ff3b30;--accent-2:#ff6961;--accent-soft:rgba(255,59,48,0.08);--accent-ring:rgba(255,59,48,0.25);">
      <div class="insight-label">Mental model</div>
      <h4>The 8 Mile Principle</h4>
      <p>If you've seen the movie <em>8 Mile</em>, you've seen the final rap battle where Eminem takes every shot at himself before his opponent can say a word. He said everything the other guy could have said against him — left him speechless, with nothing to do but give up the mic and walk away.</p>
      <p style="margin-top:10px;">Following a sales process does the same thing. When you address potential concerns proactively during the pitch — before the customer raises them — you <strong>"8 Mile" the objection</strong>. You take it off the table before it ever becomes a problem.</p>
      <p style="margin-top:10px;"><strong>The best way to handle an objection is to make sure you don't get it in the first place.</strong> If you're getting the same objections over and over again, that's a sign something in your process needs adjusting.</p>
    </div>

    <div class="section-tag" style="color:#ff3b30;background:rgba(255,59,48,0.08);">Definition</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:4px 0 10px;">What Makes It an Objection</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">An objection is a genuine barrier that <strong>must</strong> be overcome in order for the customer to move forward. It's not a reflex (that's a smoke screen). It's not curiosity (that's a question). It's a real problem in the customer's mind that will kill the deal if you don't address it.</p>

    <div class="pull-quote">
      When in doubt, default to smoke screen. Wait for the customer to bring it back with weight before you give it weight yourself.
      <cite>— The default rule</cite>
    </div>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">This is especially true <strong>early in the pitch</strong>. The later you are in the sale, the more likely something is a real objection. As a setter, you're mostly working early in the conversation — so most of what you hear is smoke screens, not objections. But you need to know how to handle the real ones when they come.</p>

    <div class="section-tag" style="color:#ff3b30;background:rgba(255,59,48,0.08);">What to listen for</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 10px;">Common Objections</h2>
    <ul style="color:#1d1d1f;font-size:15.5px;line-height:1.8;margin:0 0 20px;padding-left:22px;">
      <li><em>"I had Brightspeed in the past and my coverage was terrible — I was having slowdowns constantly."</em></li>
      <li><em>"My spouse handles the account — I can't make that decision on my own."</em></li>
      <li><em>"I'm locked into a contract with my current ISP."</em></li>
      <li><em>"I tried switching once and it was a nightmare — service took weeks to get set up."</em></li>
    </ul>

    <div class="dd-grid">
      <div class="dd-col dont">
        <h4>What NOT To Do</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:8px 0 8px 26px;position:relative;border:none;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Dive into a rant about network improvements </li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Get defensive or sound like a salesman</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Use ten words when three will do</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Lose control while you're busy talking</li>
        </ul>
      </div>
      <div class="dd-col do">
        <h4>The Reason Redirect Method</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:8px 0 8px 26px;position:relative;border:none;"><span style="position:absolute;left:2px;top:8px;color:#34c759;font-weight:700;">1.</span><strong>Question (Discovery)</strong> — ask before you answer. Control first.</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#34c759;font-weight:700;">2.</span><strong>Reason (Short + Logical)</strong> — a brief, tailored response. Not a rant.</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#34c759;font-weight:700;">3.</span><strong>Redirect (Move Forward)</strong> — ask a question that gets past the objection.</li>
        </ul>
      </div>
    </div>

    <div class="insight-card" style="--accent:#ff3b30;--accent-2:#ff6961;--accent-soft:rgba(255,59,48,0.08);--accent-ring:rgba(255,59,48,0.25);">
      <div class="insight-label">Why the question comes first</div>
      <p>You need control of the conversation before you can reason with anyone. The discovery question also changes your answer — "10 years ago" is a very different situation than "6 months ago," and your reasoning needs to match. Skip the question and you're guessing, and it sounds like a script.</p>
    </div>

    <div class="section-tag" style="color:#ff3b30;background:rgba(255,59,48,0.08);">Walkthrough</div>
    <h2 style="font-size:22px;color:#1d1d1f;margin:22px 0 14px;">Full Example — "I had Brightspeed in the past and my coverage was terrible"</h2>
    <div style="background:#f5f5f7;border-radius:14px;padding:24px 28px;margin-bottom:20px;">
      <p style="margin:0 0 8px;"><strong>Step 1 — Question (Discovery):</strong></p>
      <p style="margin:0 0 6px;">"Oh man, yeah — internet is something that needs to work. How long ago was it that you had Brightspeed?"</p>
      <p style="margin:0 0 14px;color:#6e6e73;"><em>(or: "How long have you had X-Finity now?" — both get you the same answer)</em></p>

      <p style="margin:0 0 14px;"><strong>Customer:</strong> "About 10 years ago."</p>

      <p style="margin:0 0 8px;"><strong>Step 2 — Reason (Short, Logical):</strong></p>
      <p style="margin:0 0 14px;"><em>(light laugh)</em> "Yeah, I mean that makes sense — 10 years ago I think everybody was kind of struggling with network reliability. I'm sure you've noticed even X-Finity's made major improvements since then. Brightspeed today is one of the top choices for network reliability."</p>

      <p style="margin:0 0 8px;"><strong>Step 3 — Redirect:</strong></p>
      <p style="margin:0 0 12px;">"Setting aside some of the service issues you had in the past — if the deal made sense, would you be opposed to at least considering it?"</p>

      <p style="margin:0;color:#86868b;font-size:14px;">You gathered information with a question, gave a reasonable and logical answer tailored to what they told you, and then redirected the conversation forward. You never ranted, never got defensive, and you stayed in control the whole time.</p>
    </div>

    <div class="pull-quote">
      Most objections are avoidable by following the process — 8 Mile them before they come up. The ones that do come up: Question → Reason → Redirect.
      <cite>— The big picture</cite>
    </div>
  `;
    }

      <div>
        <h3 style="margin-bottom:4px;">Connect the customer to the closer</h3>

    /* ------- SMS Consent Flow (Booking Appointments) ------- */
    function renderSMSConsentPage() {
      const content = document.getElementById('content');
      content.innerHTML = `
    <div class="sec-hero">
      <div class="section-tag">Booking Appointments · SMS Consent</div>
      <h1>SMS Consent Flow</h1>
      <p class="lead">Two one-time text messages fire automatically when you book. This page covers what those messages say, why you need verbal consent before they send, and what happens when they go to someone who wasn't actually ready to be booked.</p>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hs-num">2</div><div class="hs-lbl">Texts fire per booking</div></div>
        <div class="hero-stat"><div class="hs-num">Verbal</div><div class="hs-lbl">Consent required</div></div>
        <div class="hero-stat"><div class="hs-num">STOP</div><div class="hs-lbl">Kills the lead forever</div></div>
      </div>
    </div>

    <div class="cmp-callout" style="margin-top:0;margin-bottom:28px;border-left:4px solid #ff3b30;background:#fff5f5;">
      <strong style="color:#ff3b30;">⚠ Compliance Requirement — Verbal Consent</strong><br>
      You <strong>must</strong> get the customer's verbal consent to receive a text message <em>before</em> you book the appointment or initiate the warm transfer. No consent = no booking. The simplest way to get it is already in the script:<br><br>
      <div style="background:#f5f5f7;border-radius:12px;padding:14px 18px;margin:8px 0 4px 0;font-style:italic;color:#1d1d1f;">
        "Is it okay if I send you a quick text message to confirm that appointment?"
      </div>
      <div style="margin-top:6px;font-size:14px;color:#6e6e73;">Or: "I'm going to send you a quick text to confirm — is that alright?"</div>
      <div style="margin-top:12px;">As long as they say <strong>yes</strong> — any affirmative answer — you're clear to proceed. If they say no, you can still book the appointment, but you need to flag it and handle it differently (see your team lead).</div>
    </div>

    <div style="margin-bottom:14px;">
      <h2 style="font-size:20px;color:#1d1d1f;margin-bottom:8px;font-weight:700;">What Happens After You Book</h2>
      <p style="color:#6e6e73;margin-bottom:20px;">Once the appointment is confirmed in the system, two text messages fire automatically to the customer's phone. Here's exactly what they'll see:</p>
    </div>

    <div style="background:#1d1d1f;border-radius:20px;padding:28px 24px;margin-bottom:28px;max-width:480px;">
      <div style="text-align:center;color:#86868b;font-size:12px;font-weight:600;letter-spacing:0.5px;margin-bottom:18px;">TEXT MESSAGE PREVIEW</div>

      <div style="background:#0071e3;color:#fff;border-radius:18px 18px 4px 18px;padding:14px 18px;margin-bottom:10px;font-size:14px;line-height:1.55;">
        Hi, Michelle here — just confirming Jeffrey will be calling you later today between 7:30 PM and 8:30 PM. He's going to take a look at your current setup and see if there's anything costing you more than it should.<br><br>
        <span style="color:rgba(255,255,255,0.5);">_______________</span><br>
        <span style="font-size:12px;color:rgba(255,255,255,0.7);">Reply STOP to unsubscribe.<br>Thanks, Onyx Fiber (Authorized Brightspeed Dealer)</span>
      </div>

      <div style="background:#0071e3;color:#fff;border-radius:18px 18px 4px 18px;padding:14px 18px;font-size:14px;line-height:1.55;">
        No pressure either way — at least you'll know where you stand.
      </div>
    </div>

    <div class="content-block">
      <h3 style="margin-bottom:8px;">What's happening under the hood</h3>
      <p>These two messages are the only texts the customer will receive from this flow. The first message confirms the appointment details — who's calling, when, and what it's about. The second is a low-pressure follow-up that reinforces the "no obligation" frame. Together, they keep the prospect warm between the time you book and the time the closer calls.</p>
      <p style="margin-top:8px;">The messages are personalized automatically — the setter's name, the closer's name, and the appointment window are all pulled from what you entered when you booked.</p>
    </div>

    <div style="margin-top:36px;margin-bottom:14px;">
      <h2 style="font-size:20px;color:#1d1d1f;margin-bottom:8px;font-weight:700;">Why This Matters — The STOP Problem</h2>
    </div>

    <div class="cmp-callout" style="border-left:4px solid #ff3b30;background:#fff5f5;">
      <strong style="color:#ff3b30;">A "STOP" reply kills the lead permanently.</strong><br><br>
      When a customer replies <strong>STOP</strong> to one of these messages, that number is flagged as unsubscribed at the system level. We can never text them again. We can never call them again. We can never follow up. That lead is <strong>dead</strong> — and it was a wasted opportunity.
    </div>

    <div class="content-block" style="margin-top:20px;">
      <h3 style="margin-bottom:8px;">When does this happen?</h3>
      <p>It happens when a setter books an appointment that should have been a <strong>callback</strong> instead. The customer was polite on the phone but wasn't actually committed — maybe they were just being nice, maybe they didn't fully understand what they agreed to, maybe the timing was off. Then they get the confirmation texts, realize they're locked into something they didn't really want, and reply STOP.</p>
      <p style="margin-top:12px;">That's not the customer's fault. That's a weak set that got pushed through as a booking.</p>
    </div>

    <div class="content-block">
      <h3 style="margin-bottom:8px;">The rule is simple</h3>
      <p><strong>Before you book, ask yourself: is this person actually expecting a call?</strong> If the answer is "probably not" or "they were kind of wishy-washy," that's a callback — not a booking. Use the <strong>Call Back</strong> disposition, follow up later, and give yourself a real shot at converting them next time.</p>
      <p style="margin-top:12px;">A callback gives you another chance. A STOP gives you zero chances.</p>
    </div>
  `;
    }

    /* ------- Handoff to Closer (Booking Appointments) ------- */
    function renderHandoffToCloserPage() {
      const content = document.getElementById('content');
      content.innerHTML = `
    <div class="sec-hero">
      <div class="section-tag">Booking Appointments · Handoff to Closer</div>
      <h1>Handoff to Closer</h1>
      <p class="lead">Most of the time, closers are going into appointments blind. The only advantage they have is your notes. The more detail you leave, the better the chance they can build quick rapport, keep the customer engaged, and close the deal — which is how you earn your sit bonus.</p>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hs-num">3 min</div><div class="hs-lbl">To qualify as a sit</div></div>
        <div class="hero-stat"><div class="hs-num">Blind</div><div class="hs-lbl">Closer's default state</div></div>
        <div class="hero-stat"><div class="hs-num">Notes</div><div class="hs-lbl">Your only advantage</div></div>
      </div>
    </div>

    <div class="pull-quote" style="margin:24px 0;">
      Your notes turn a cold open into a warm conversation. Without them, the closer is starting from zero — on someone else's lead.
    </div>

    <div style="margin-bottom:14px;">
      <h2 style="font-size:20px;color:#1d1d1f;margin-bottom:8px;font-weight:700;">What Goes in the Notes</h2>
      <p style="color:#6e6e73;margin-bottom:20px;">Put yourself in the shoes of a closer who wants as much information as possible going into the call. Even small details matter. Here's what we expect to see:</p>
    </div>

    <div class="content-block" style="display:flex;gap:16px;align-items:flex-start;">
      <div style="background:#0071e3;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;">1</div>
      <div>
        <h3 style="margin-bottom:4px;">Who did you talk to?</h3>
        <p>Name, title if they gave one, and whether they're the decision-maker. If you had to go through a receptionist or gatekeeper to reach them, note that too — the closer will likely have to do the same thing on the callback.</p>
      </div>
    </div>

    <div class="content-block" style="display:flex;gap:16px;align-items:flex-start;">
      <div style="background:#0071e3;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;">2</div>
      <div>
        <h3 style="margin-bottom:4px;">What was the situation?</h3>
        <p>Were they busy? In the middle of something? In an office, on a job site, driving? This tells the closer what kind of energy to expect when they call back. Someone who was rushing between meetings is a different conversation than someone who was relaxed at their desk.</p>
      </div>
    </div>

    <div class="content-block" style="display:flex;gap:16px;align-items:flex-start;">
      <div style="background:#0071e3;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;">3</div>
      <div>
        <h3 style="margin-bottom:4px;">What did they tell you about their current setup?</h3>
        <p>This is gold. Anything they shared about their carrier, how long they've been with them, whether their bill has been going up, how many lines they have — all of it. "Had T-Mobile for 20 years" is different from "just switched to T-Mobile last month." The closer needs to know what they're working with.</p>
      </div>
    </div>

    <div class="content-block" style="display:flex;gap:16px;align-items:flex-start;">
      <div style="background:#0071e3;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;">4</div>
      <div>
        <h3 style="margin-bottom:4px;">Anything else you noticed</h3>
        <p>Even if it seems small, write it down. "I heard dogs barking in the background." "He mentioned he's got two locations." "She said she just moved here from Texas." These kinds of details give the closer something to connect on — and that connection is often what keeps the customer on the line long enough to close.</p>
      </div>
    </div>

    <div style="margin-top:36px;margin-bottom:14px;">
      <h2 style="font-size:20px;color:#1d1d1f;margin-bottom:8px;font-weight:700;">Booking Time Matters</h2>
      <p style="color:#6e6e73;margin-bottom:20px;">When you book the appointment is just as important as whether you book it. Getting the timing wrong means the closer calls at the worst possible moment — and the customer doesn't pick up or is too distracted to engage.</p>
    </div>

    <div class="content-block">
      <h3 style="margin-bottom:8px;">Ask about their schedule before you book</h3>
      <p>Don't just pick a time slot that looks open on the calendar. Ask the customer what their day looks like. A few questions that work well:</p>
      <div style="background:#f5f5f7;border-radius:12px;padding:14px 18px;margin:12px 0;font-style:italic;color:#1d1d1f;">
        "What does your schedule normally look like in the afternoons?"<br>
        "What time do you usually get off work?"<br>
        "What time do you get home?"
      </div>
      <p style="margin-top:8px;">You're trying to find the window where they're available, relaxed, and not in the middle of something. If they tell you they're done at 5 but have a 30-minute commute, book for 5:45 — not 5:00. Put these details in the notes so the closer knows <em>why</em> you picked the time you picked.</p>
    </div>

    <div class="cmp-callout" style="margin-top:24px;border-left:4px solid #ff3b30;background:#fff5f5;">
      <strong style="color:#ff3b30;">⚠ Always check the customer's time zone before booking.</strong><br><br>
      This is one of the most common and most costly mistakes. If you book at 6:00 PM and the customer is two time zones ahead, the closer is calling them at 8:00 PM their time. That's the difference between catching someone after dinner and waking up their kids. Confirm the time zone, adjust accordingly, and note it so the closer knows.
    </div>

    <div class="content-block" style="margin-top:20px;">
      <h3 style="margin-bottom:8px;">Think about where they'll be</h3>
      <p>Are you booking the appointment while the customer is going to be in the middle of their workday? Or in between jobs? A business owner who told you they're slammed from 9 to 5 isn't going to take a 2:00 PM call from a stranger — no matter how good your notes are. Book it for when they said they'd actually be free, and your set rate will reflect it.</p>
    </div>
  `;
    }

    /* ------- Main router ------- */
    function render() {
      renderTopNav();
      renderSidebar();
      if (currentSection === 'home') {
        renderHome();
      } else if (currentSection === 'pitch' && currentSub === 'solidifying') {
        renderSolidifyingPage();
      } else if (currentSection === 'pitch' && currentSub === 'obj-overview') {
        renderObjOverviewPage();
      } else if (currentSection === 'pitch' && currentSub === 'questions') {
        renderQuestionsPage();
      } else if (currentSection === 'pitch' && currentSub === 'smokescreens') {
        renderSmokescreensPage();
      } else if (currentSection === 'pitch' && currentSub === 'objections') {
        renderObjectionsPage();
      } else if (currentSection === 'pitch' && currentSub === 'obj-quiz') {
        renderObjectionsQuizPage();
      } else if (currentSection === 'pitch' && currentSub === 'pitch-quiz') {
        renderPitchQuizPage();
      } else if (currentSection === 'product' && currentSub === 'terminology') {
        renderTerminologyPage();
      } else if (currentSection === 'product' && currentSub === 'competition') {
        renderCompetitionPage();
      } else if (currentSection === 'product' && currentSub === 'why-vz') {
        renderWhyATTPage();
      } else if (currentSection === 'compliance') {
        renderCompliancePage();
        applySectionAccent();
        bindQuizHandlers();
        return; // renderer handles scroll
      } else if (currentSection === 'booking' && currentSub === 'live') {
        renderBookItLivePage();
      } else if (currentSection === 'booking' && currentSub === 'warm-transfer') {
        renderWarmTransferPage();
      } else if (currentSection === 'booking' && currentSub === 'sms') {
        renderSMSConsentPage();
      } else if (currentSection === 'booking' && currentSub === 'handoff') {
        renderHandoffToCloserPage();
      } else if (currentSection === 'booking' && currentSub === 'booking-quiz') {
        renderBookingQuizPage();
      } else {
        renderPlaceholderPage();
      }
      // Apply section accent class to content container
      applySectionAccent();
      // Bind quiz + checklist handlers for any newly-rendered pages
      bindQuizHandlers();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applySectionAccent() {
      const content = document.getElementById('content');
      if (!content) return;
      const map = {
        'home': 'sec-home',
        'pitch': 'sec-pitch',
        'booking': 'sec-booking',
        'product': 'sec-product',
        'top-reps': 'sec-toprep',
        'compliance': 'sec'
      };
      content.classList.remove('sec', 'sec-home', 'sec-pitch', 'sec-dialer', 'sec-booking', 'sec-product', 'sec-toprep');
      content.classList.add('sec');
      if (map[currentSection]) content.classList.add(map[currentSection]);
    }

    // init
    (function () {
      currentSection = 'home';
      currentSub = null;
      render();
    })();
  </script>
