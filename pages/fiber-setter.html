<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Strike Fiber Setter training, scripts, booking workflows, fiber product knowledge, compliance, and coaching resources.">
  <meta name="theme-color" content="#02050a">
  <meta name="color-scheme" content="dark">
  <title>Strike Fiber Setter Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.68;
      overflow-x: hidden;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============ TOP NAV ============ */
    .topnav {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid #d2d2d7;
      padding: 0 36px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      min-height: 64px;
      gap: 24px;
    }

    .topnav .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
      color: #1d1d1f;
      flex-shrink: 0;
      padding: 10px 0;
    }

    .topnav .brand .logo-badge {
      width: auto;
      height: 63px;
      color: #1d1d1f;
      display: flex;
      align-items: center;
    }

    .topnav .brand .logo-badge img {
      height: 63px;
      width: auto;
    }

    .topnav .brand .logo-badge a {
      display: flex;
      align-items: center;
    }

    .topnav .brand .label {
      color: #86868b;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      font-weight: 600;
    }

    .topnav .brand .name {
      display: block;
      font-size: 15px;
      color: #1d1d1f;
    }

    .topnav-links {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      padding: 6px 0;
    }

    .topnav-link {
      background: transparent;
      border: none;
      color: #86868b;
      padding: 8px 16px;
      border-radius: 980px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
      position: relative;
    }

    .topnav-link:hover {
      color: #1d1d1f;
      background: rgba(0, 0, 0, 0.04);
    }

    .topnav-link.active {
      color: #fff;
      background: #0071e3;
    }

    .topnav-link.active::after {
      display: none;
    }

    /* ============ LAYOUT ============ */
    .main-wrap {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: 240px;
      background: #ffffff;
      border-right: 1px solid #d2d2d7;
      padding: 28px 16px;
      flex-shrink: 0;
      display: none;
    }

    .sidebar.visible {
      display: block;
    }

    .sidebar h4 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #86868b;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .sidebar-link {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #424245;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      transition: all 0.15s;
    }

    .sidebar-link:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #1d1d1f;
    }

    .sidebar-link.active {
      background: #0071e3;
      color: #fff;
      font-weight: 600;
    }

    .sidebar-link .status {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #86868b;
      margin-left: 6px;
      font-weight: 600;
    }

    .sidebar-link.active .status {
      color: rgba(255, 255, 255, 0.7);
    }

    .content {
      flex: 1;
      padding: 48px 56px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* ============ HOME / OVERVIEW ============ */
    .hero {
      padding: 48px 0 64px;
      text-align: center;
      border-bottom: 1px solid #d2d2d7;
      margin-bottom: 56px;
    }

    .hero .eyebrow {
      color: #0071e3;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      color: #1d1d1f;
    }

    .hero .sub {
      color: #86868b;
      font-size: 19px;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 50px;
    }

    .overview-card {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      padding: 28px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    .overview-card::before {
      display: none;
    }

    .overview-card:hover {
      border-color: #0071e3;
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .overview-card .icon {
      font-size: 28px;
      margin-bottom: 14px;
      display: block;
    }

    .overview-card h3 {
      font-size: 19px;
      margin-bottom: 8px;
      color: #1d1d1f;
      font-weight: 600;
    }

    .overview-card p {
      color: #86868b;
      font-size: 15px;
      line-height: 1.5;
    }

    .overview-card .card-status {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 980px;
      font-weight: 700;
    }

    .status-live {
      background: rgba(52, 199, 89, 0.12);
      color: #248a3d;
    }

    .status-soon {
      background: rgba(255, 149, 0, 0.12);
      color: #c93400;
    }

    .welcome-block {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      padding: 36px;
      margin-bottom: 40px;
    }

    .welcome-block h2 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #1d1d1f;
      font-weight: 600;
    }

    .welcome-block p {
      color: #424245;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .welcome-block .caveat {
      color: #86868b;
      font-style: italic;
      font-size: 15px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e8e8ed;
    }

    .welcome-block ul.expect-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 4px;
    }

    .welcome-block ul.expect-list li {
      color: #424245;
      font-size: 16px;
      line-height: 1.6;
      padding: 12px 0 12px 28px;
      border-bottom: 1px solid #f0f0f3;
      position: relative;
    }

    .welcome-block ul.expect-list li:last-child {
      border-bottom: none;
    }

    .welcome-block ul.expect-list li::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 22px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0071e3;
    }

    .welcome-block blockquote.welcome-quote {
      border-left: 3px solid #0071e3;
      padding: 8px 0 8px 22px;
      margin: 16px 0 18px;
      color: #1d1d1f;
      font-size: 18px;
      line-height: 1.55;
      font-weight: 500;
    }

    .welcome-block p.abb {
      font-size: 18px;
      color: #1d1d1f;
      margin-top: 18px;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }

    /* ============ SECTION PAGES ============ */
    .section-head {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid #d2d2d7;
    }

    .section-head .crumb {
      color: #86868b;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .section-head h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #1d1d1f;
    }

    .section-head .lead {
      color: #86868b;
      font-size: 17px;
      max-width: 760px;
      line-height: 1.6;
    }

    .placeholder {
      background: #ffffff;
      border: 1px dashed #d2d2d7;
      border-radius: 18px;
      padding: 48px;
      text-align: center;
      margin-bottom: 24px;
    }

    .placeholder .big-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .placeholder h3 {
      font-size: 21px;
      margin-bottom: 10px;
      color: #1d1d1f;
    }

    .placeholder p {
      color: #86868b;
      font-size: 15px;
      max-width: 520px;
      margin: 0 auto 20px;
    }

    .placeholder .roadmap {
      display: inline-block;
      text-align: left;
      background: #f5f5f7;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 20px 26px;
      margin-top: 12px;
    }

    .placeholder .roadmap h4 {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #0071e3;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .placeholder .roadmap ul {
      list-style: none;
    }

    .placeholder .roadmap li {
      padding: 5px 0 5px 22px;
      position: relative;
      color: #424245;
      font-size: 15px;
    }

    .placeholder .roadmap li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: #0071e3;
      font-weight: 700;
    }

    /* ============ EMBEDDED PITCH TRAINING (migrated) ============ */

    .pitch-header {
      margin-bottom: 28px;
    }

    .pitch-header h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .pitch-header .pitch-sub {
      color: #86868b;
      font-style: italic;
      font-size: 16px;
    }

    .progress-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .progress-seg {
      flex: 1;
      height: 4px;
      background: #e8e8ed;
      border-radius: 2px;
      transition: background 0.25s;
    }

    .progress-seg.active {
      background: #0071e3;
    }

    .progress-seg.done {
      background: #34c759;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 28px;
    }

    .step-tab {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      color: #86868b;
      padding: 12px 6px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .step-tab:hover {
      border-color: #0071e3;
      color: #1d1d1f;
    }

    .step-tab.active {
      background: #0071e3;
      color: #fff;
      border-color: #0071e3;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
    }

    .step-tab.full-script-tab {
      border: 1px dashed #0071e3;
      color: #0071e3;
    }

    .step-tab.full-script-tab:hover {
      background: rgba(0, 113, 227, 0.06);
    }

    .step-tab.full-script-tab.active {
      background: #0071e3;
      color: #fff;
      border: 1px solid #0071e3;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
    }

    .step-tab .num {
      display: block;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .step-tab .icon {
      display: block;
      font-size: 17px;
      margin-bottom: 3px;
    }

    .step-card,
    .full-script-card {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      padding: 40px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .step-card.active,
    .full-script-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-card h2 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #1d1d1f;
    }

    .step-card .phase-tag {
      display: inline-block;
      background: rgba(0, 113, 227, 0.1);
      color: #0071e3;
      padding: 4px 14px;
      border-radius: 980px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .step-card .lead {
      color: #86868b;
      font-size: 16px;
      margin-bottom: 28px;
      font-style: italic;
    }

    .section-sub {
      margin-bottom: 24px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
      color: #86868b;
    }

    .section-label .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-green {
      background: #34c759;
    }

    .dot-red {
      background: #ff3b30;
    }

    .dot-blue {
      background: #0071e3;
    }

    .dot-orange {
      background: #ff9500;
    }

    .script-block {
      background: #f5f5f7;
      border-left: 3px solid #34c759;
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 10px;
      color: #1d1d1f;
      font-size: 16px;
    }

    .script-block .quote {
      font-style: italic;
      color: #0071e3;
    }

    .script-block .speaker {
      font-style: normal;
      font-size: 11px;
      color: #86868b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    .script-block .stage-dir {
      display: block;
      color: #86868b;
      font-size: 14px;
      margin-top: 6px;
      font-style: italic;
    }

    .if-block {
      background: rgba(52, 199, 89, 0.06);
      border-left: 3px solid #34c759;
      padding: 12px 18px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .if-block .label {
      color: #248a3d;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }

    .if-block .quote {
      font-style: italic;
      color: #0071e3;
    }

    .if-block .note {
      display: block;
      color: #86868b;
      font-size: 14px;
      font-style: italic;
      margin-top: 6px;
    }

    .why-box {
      background: rgba(0, 113, 227, 0.05);
      border: 1px solid rgba(0, 113, 227, 0.2);
      border-radius: 14px;
      padding: 20px 24px;
    }

    .why-box p {
      color: #424245;
      font-size: 15px;
    }

    .weak-box {
      background: rgba(255, 59, 48, 0.05);
      border: 1px solid rgba(255, 59, 48, 0.2);
      border-radius: 14px;
      padding: 20px 24px;
    }

    .weak-box ul {
      list-style: none;
    }

    .weak-box li {
      padding: 4px 0 4px 24px;
      position: relative;
      color: #424245;
      font-size: 15px;
    }

    .weak-box li::before {
      content: "✗";
      position: absolute;
      left: 0;
      color: #ff3b30;
      font-weight: 700;
    }

    .insight-box {
      background: linear-gradient(135deg, rgba(0, 113, 227, 0.08) 0%, rgba(0, 113, 227, 0.03) 100%);
      border: 1px solid rgba(0, 113, 227, 0.2);
      border-radius: 14px;
      padding: 22px 26px;
      position: relative;
    }

    .insight-box::before {
      content: "💡";
      position: absolute;
      top: -14px;
      left: 20px;
      background: #ffffff;
      padding: 0 8px;
      font-size: 20px;
    }

    .insight-box p {
      color: #1d1d1f;
      font-size: 16px;
      font-weight: 500;
    }

    .pro-tip,
    .compliance-note {
      border-radius: 0 12px 12px 0;
      padding: 14px 20px 14px 44px;
      margin-bottom: 12px;
      position: relative;
      font-size: 15px;
      color: #424245;
    }

    .pro-tip {
      background: rgba(255, 149, 0, 0.06);
      border-left: 3px solid #ff9500;
    }

    .pro-tip::before {
      content: "⚡";
      position: absolute;
      left: 16px;
      top: 14px;
      font-size: 16px;
    }

    .pro-tip strong {
      color: #c93400;
    }

    .availability-tip {
      position: relative;
      background: rgba(175, 82, 222, 0.10);
      border-left: 3px solid #af52de;
      border-radius: 0 12px 12px 0;
      padding: 14px 20px 14px 44px;
      margin-bottom: 12px;
      color: #eaf3fb;
    }

    .availability-tip::before {
      content: "👥";
      position: absolute;
      left: 14px;
      top: 13px;
      font-size: 16px;
    }

    .availability-tip strong {
      color: #8e44ad;
    }

    .scout-options {
      margin: 12px 0 10px;
      padding: 18px 20px;
      border: 1px solid #168dff;
      border-left: 4px solid #168dff;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(22, 141, 255, .16), rgba(7, 92, 174, .10));
    }

    .scout-options .speaker {
      display: block;
      margin-bottom: 6px;
      color: #eaf3fb;
      font-size: 11px;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .scout-options .quote {
      color: #49adff;
      font-size: 16px;
      font-style: italic;
    }

    .scout-options .stage-dir {
      display: block;
      margin-top: 6px;
      color: #aebdce;
      font-size: 14px;
      font-style: italic;
    }

    .compliance-note {
      background: rgba(255, 59, 48, 0.05);
      border-left: 3px solid #ff3b30;
    }

    .compliance-note::before {
      content: "🎙";
      position: absolute;
      left: 16px;
      top: 14px;
      font-size: 16px;
    }

    .compliance-note strong {
      color: #ff3b30;
    }

    .amp-card {
      background: #f5f5f7;
      border: 1px solid #d2d2d7;
      border-left: 3px solid #ff9500;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 8px;
    }

    .amp-card .q {
      color: #0071e3;
      font-style: italic;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .amp-card .why {
      color: #86868b;
      font-size: 14px;
    }

    .expand-btn {
      background: #f5f5f7;
      border: 1px dashed #d2d2d7;
      color: #86868b;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      width: 100%;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .expand-btn:hover {
      border-color: #0071e3;
      color: #0071e3;
    }

    .expand-btn .chev {
      display: inline-block;
      margin-left: 6px;
      transition: transform 0.2s;
    }

    .expand-btn.open .chev {
      transform: rotate(180deg);
    }

    .extra-amps {
      display: none;
      margin-top: 10px;
    }

    .extra-amps.open {
      display: block;
    }

    .optional-opener {
      background: rgba(0, 113, 227, 0.04);
      border: 1px dashed rgba(0, 113, 227, 0.3);
      border-radius: 14px;
      padding: 18px 22px;
      margin-top: 12px;
    }

    .optional-opener .title {
      color: #0071e3;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .optional-opener .quote {
      font-style: italic;
      color: #0071e3;
      font-size: 15px;
    }

    .optional-opener .note {
      color: #86868b;
      font-size: 14px;
      margin-top: 8px;
      font-style: italic;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 28px;
      gap: 12px;
    }

    .nav-btn {
      background: #ffffff;
      border: 1px solid #d2d2d7;

    }

    .challenger-quote {
      border-left: 4px solid #d97706;
      background: #fffbeb;
    }

    /* Redefine the profile-grid for star span-2 effect */
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 18px 0 6px;
    }

    @media (max-width: 720px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .profile-card.star {
        grid-column: span 1;
      }

      .ch-hero .num {
        font-size: 56px;
      }
    }

    /* Interactive diagnostic checklist */
    .ch-checklist {
      list-style: none;
      padding: 0;
      margin: 16px 0 6px;
      display: grid;
      gap: 8px;
    }

    .ch-checklist li {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #d2d2d7;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .ch-checklist li:hover {
      border-color: #d97706;
      background: #fffbeb;
      transform: translateX(2px);
    }

    .ch-checklist li.checked {
      background: #fef3c7;
      border-color: #d97706;
    }

    .ch-checklist .box {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: 2px solid #c7c7cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
      transition: all 0.18s ease;
    }

    .ch-checklist li.checked .box {
      background: #d97706;
      border-color: #d97706;
    }

    .ch-checklist li.checked .box::after {
      content: '✓';
    }

    .ch-checklist .text {
      flex: 1;
      font-size: 15px;
      line-height: 1.5;
      color: #1d1d1f;
    }

    /* Mapping flow diagram */
    .ch-flow {
      margin: 18px 0 6px;
    }

    .ch-flow-step {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 18px;
      margin-bottom: 14px;
      position: relative;
    }

    .ch-flow-step::after {
      content: '';
      position: absolute;
      left: 45px;
      top: 92px;
      bottom: -14px;
      width: 2px;
      background: repeating-linear-gradient(to bottom, #fde68a 0 6px, transparent 6px 12px);
    }

    .ch-flow-step:last-child::after {
      display: none;
    }

    .ch-flow-num {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.28);
      position: relative;
      z-index: 1;
    }

    .ch-flow-num .n {
      font-size: 32px;
      line-height: 1;
    }

    .ch-flow-num .beat {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.95;
      margin-top: 4px;
      font-weight: 700;
    }

    .ch-flow-body {
      background: #ffffff;
      border: 1px solid #e5e5ea;
      border-left: 4px solid #d97706;
      border-radius: 12px;
      padding: 16px 20px;
    }

    .ch-flow-body .beat-title {
      font-size: 18px;
      font-weight: 700;
      color: #1d1d1f;
      margin: 0 0 4px;
    }

    .ch-flow-body .phase-ref {
      font-size: 11px;
      color: #b45309;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: block;
    }

    .ch-flow-body .script {
      display: block;
      margin: 10px 0;
      padding: 10px 14px;
      background: #fafafa;
      border-left: 2px solid #d2d2d7;
      border-radius: 6px;
      font-style: italic;
      color: #1d1d1f;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .ch-flow-body .why {
      font-size: 14px;
      color: #515154;
      line-height: 1.55;
      margin: 8px 0 0;
    }

    @media (max-width: 720px) {
      .ch-flow-step {
        grid-template-columns: 70px 1fr;
        gap: 14px;
      }

      .ch-flow-num {
        width: 70px;
        height: 70px;
      }

      .ch-flow-num .n {
        font-size: 24px;
      }

      .ch-flow-step::after {
        left: 34px;
        top: 70px;
      }
    }

    /* ============ SCHEDULE / POWER HOUR ============ */
    .schedule-timeline {

      gap: 8px;

    .schedule-row {

    .schedule-block .sub {

    .power-menu {

    .power-item {

    .power-item .ico {

    }

    .power-item h5 {

    .power-item p {

    .drifter-split {

    .drifter-col {

    }

    .drifter-col.scheduled {

    }

    .drifter-col h4 {
      font-size: 17px;
      color: #1d1d1f;
      margin-bottom: 10px;
    }

    .drifter-col p {
      color: #424245;

    /* ============ COMPLIANCE ============ */

    .compliance-intro p {

    .cmp-section {

    .cmp-section h4 {
      color: #1d1d1f;
      font-size: 13px;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .cmp-section p {
      color: #424245;

    .cmp-section ul {

    .cmp-section ul li {

    .cmp-quote {

    .cmp-col {

    .cmp-col.do {

    .cmp-col.dont {

    .cmp-col h5 {

    }

    .cmp-col.do h5 {

    }

    .cmp-col.dont h5 {

    .cmp-col ul {

    .cmp-col ul li {

    .cmp-callout {
      background: rgba(0, 113, 227, 0.05);
      border-left: 3px solid #0071e3;

      border-radius: 0 8px 8px 0;
      margin: 14px 0;

    .cmp-callout strong {

    }

    .cmp-danger {
      background: rgba(255, 59, 48, 0.05);
      border-left: 3px solid #ff3b30;
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      color: #424245;

    .cmp-compare {

    }

    .cmp-compare .col {

    }

    .cmp-compare .col.biz {

    .cmp-compare .col.consumer {

    .cmp-compare .col h5 {

    .cmp-compare .col ul {

    .cmp-compare .col ul li {

    /* ============ COMPLIANCE QUIZ CTA ============ */
    .cmp-quiz-cta {

    /* ============================================================== */
    /*  REUSABLE ENGAGEMENT SYSTEM                                    */
    /*  Per-section accent via --accent / --accent-soft / --accent-2  */
    /* ============================================================== */

    .sec {
      --accent: #0071e3;
      --accent-2: #0a84ff;
      --accent-soft: rgba(0, 113, 227, 0.08);
      --accent-ring: rgba(0, 113, 227, 0.25);
    }

    .sec-pitch {
      --accent: #0071e3;
      --accent-2: #5ac8fa;
      --accent-soft: rgba(0, 113, 227, 0.08);
      --accent-ring: rgba(0, 113, 227, 0.25);
    }

    .sec-dialer {
      --accent: #7c3aed;
      --accent-2: #a855f7;
      --accent-soft: rgba(124, 58, 237, 0.08);
      --accent-ring: rgba(124, 58, 237, 0.25);
    }

    .sec-booking {
      --accent: #059669;
      --accent-2: #10b981;
      --accent-soft: rgba(5, 150, 105, 0.08);
      --accent-ring: rgba(5, 150, 105, 0.25);
    }

    .sec-product {
      --accent: #0891b2;
      --accent-2: #06b6d4;
      --accent-soft: rgba(8, 145, 178, 0.08);
      --accent-ring: rgba(8, 145, 178, 0.25);
    }

    .sec-toprep {
      --accent: #d97706;
      --accent-2: #f59e0b;
      --accent-soft: rgba(217, 119, 6, 0.08);
      --accent-ring: rgba(217, 119, 6, 0.25);
    }

    .sec-home {
      --accent: #1d1d1f;
      --accent-2: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.06);
      --accent-ring: rgba(0, 113, 227, 0.2);
    }

    /* --- Section hero --- */
    .sec-hero {
      position: relative;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 44px 48px;
      margin-bottom: 32px;
      overflow: hidden;
      box-shadow: 0 8px 30px var(--accent-ring);
    }

    .sec-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(900px 300px at 85% -40%, rgba(255, 255, 255, 0.18), transparent 60%);
      pointer-events: none;
    }

    .sec-hero .sec-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .sec-hero h1 {
      color: #ffffff;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 10px;
      line-height: 1.1;
    }

    .sec-hero p.lead {
      color: rgba(255, 255, 255, 0.92);
      font-size: 18px;
      line-height: 1.55;
      margin: 0;
      max-width: 760px;
    }

    .sec-hero .crumb {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* --- Hero stat chips --- */
    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .hero-stat {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 12px 18px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 140px;
    }

    .hero-stat .hero-stat-num {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .hero-stat .hero-stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
    }

    /* --- Section tag (for prose sections) --- */
    .section-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 980px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* --- Pull quote --- */
    .pull-quote {
      background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(255, 255, 255, 0) 60%);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 22px 26px;
      margin: 26px 0;
      font-size: 18px;
      line-height: 1.55;
      color: #1d1d1f;
      font-style: italic;
      position: relative;
    }

    .pull-quote::before {
      content: "\201C";
      position: absolute;
      top: -6px;
      left: 10px;
      font-size: 60px;
      line-height: 1;
      color: var(--accent);
      opacity: 0.25;
      font-family: Georgia, serif;
    }

    .pull-quote cite {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      color: #6e6e73;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* --- Flow diagram (numbered steps with dotted connectors) --- */
    .flow-diagram {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 24px 0;
      position: relative;
    }

    .flow-step {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 14px;
      padding: 20px 20px 18px;
      position: relative;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .flow-step:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
      border-color: var(--accent);
    }

    .flow-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px var(--accent-ring);
    }

    .flow-step h4 {
      font-size: 16px;
      font-weight: 700;
      color: #1d1d1f;
      margin: 0 0 6px;
    }

    .flow-step p {
      font-size: 14px;
      color: #424245;
      line-height: 1.55;
      margin: 0;
    }

    /* --- Self checklist (interactive) --- */
    .self-checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .self-check-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .self-check-item:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .self-check-item .check-box {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      border: 2px solid #d2d2d7;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: all 0.18s ease;
      margin-top: 1px;
    }

    .self-check-item.checked .check-box {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .self-check-item.checked .check-box::after {
      content: "✓";
      font-size: 14px;
      font-weight: 700;
    }

    .self-check-item .check-text {
      flex: 1;
      font-size: 15px;
      color: #1d1d1f;
      line-height: 1.5;
    }

    .self-check-item.checked .check-text {
      color: #6e6e73;
      text-decoration: line-through;
    }

    /* --- Do / Don't grid --- */
    .dd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 22px 0;
    }

    @media (max-width: 700px) {
      .dd-grid {
        grid-template-columns: 1fr;
      }
    }

    .dd-col {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 14px;
      padding: 22px 24px;
    }

    .dd-col.do {
      border-left: 4px solid #34c759;
    }

    .dd-col.dont {
      border-left: 4px solid #ff3b30;
    }

    .dd-col h4 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin: 0 0 14px;
      font-weight: 700;
    }

    .dd-col.do h4 {
      color: #28a745;
    }

    .dd-col.dont h4 {
      color: #d0342c;
    }

    .dd-col ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .dd-col li {
      font-size: 15px;
      line-height: 1.55;
      color: #1d1d1f;
      padding: 8px 0 8px 26px;
      position: relative;
    }

    .dd-col li+li {
      border-top: 1px solid #f0f0f3;
    }

    .dd-col.do li::before {
      content: "✓";
      color: #34c759;
      font-weight: 700;
      position: absolute;
      left: 2px;
      top: 8px;
    }

    .dd-col.dont li::before {
      content: "✕";
      color: #ff3b30;
      font-weight: 700;
      position: absolute;
      left: 2px;
      top: 8px;
    }

    /* --- Insight card (reusable across sections) --- */
    .insight-card {
      background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(255, 255, 255, 0) 80%);
      border: 1px solid #d2d2d7;
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 22px 26px;
      margin: 22px 0;
    }

    .insight-card .insight-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .insight-card h4 {
      font-size: 18px;
      margin: 0 0 10px;
      color: #1d1d1f;
    }

    .insight-card p {
      font-size: 15px;
      line-height: 1.6;
      color: #424245;
      margin: 0;
    }

    /* --- Section card grid (for home + indexes) --- */
    .scard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin: 22px 0 32px;
    }

    .scard {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 16px;
      padding: 22px 22px 18px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .scard::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
      opacity: 0.9;
    }

    .scard:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      border-color: var(--accent);
    }

    .scard .scard-icon {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .scard h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1d1d1f;
      margin: 0 0 6px;
    }

    .scard p {
      font-size: 14px;
      color: #6e6e73;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .scard .scard-cta {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scard .scard-cta::after {
      content: "→";
      transition: transform 0.18s ease;
    }

    .scard:hover .scard-cta::after {
      transform: translateX(4px);
    }

    .scard .scard-modules {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 14px;
    }

    .scard .scard-mod {
      font-size: 11px;
      color: #6e6e73;
      background: #f5f5f7;
      padding: 3px 10px;
      border-radius: 980px;
      font-weight: 500;
    }

    /* --- Quiz system --- */
    .quiz-block {
      background: linear-gradient(180deg, #ffffff 0%, #fafafc 100%);
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      padding: 30px 32px;
      margin: 32px 0 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .quiz-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
    }

    .quiz-header .quiz-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px var(--accent-ring);
    }

    .quiz-header h3 {
      font-size: 22px;
      margin: 0;
      color: #1d1d1f;
      font-weight: 700;
    }

    .quiz-sub {
      font-size: 14px;
      color: #6e6e73;
      margin: 6px 0 22px;
      line-height: 1.55;
    }

    .quiz-progress {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .quiz-q {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quiz-opt {
      background: #ffffff;
      border: 1.5px solid #d2d2d7;
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-size: 15px;
      color: #1d1d1f;
      line-height: 1.45;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .quiz-opt .opt-letter {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f5f5f7;
      color: #6e6e73;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .quiz-opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .quiz-opt:hover:not(:disabled) .opt-letter {
      background: var(--accent);
      color: #ffffff;
    }

    .quiz-opt.correct {
      border-color: #34c759;
      background: rgba(52, 199, 89, 0.08);
      color: #1d1d1f;
    }

    .quiz-opt.correct .opt-letter {
      background: #34c759;
      color: #ffffff;
    }

    .quiz-opt.wrong {
      border-color: #ff3b30;
      background: rgba(255, 59, 48, 0.08);
      color: #1d1d1f;
    }

    .quiz-opt.wrong .opt-letter {
      background: #ff3b30;
      color: #ffffff;
    }

    .quiz-opt:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .quiz-opt.correct,
    .quiz-opt.wrong {
      opacity: 1;
    }

    .quiz-feedback {
      margin-top: 12px;
      border-radius: 14px;
      padding: 18px 22px;
      font-size: 14.5px;
      line-height: 1.6;
      display: none;
      animation: qfFadeIn 0.25s ease;
    }

    .quiz-feedback.show {
      display: block;
    }

    .quiz-feedback.good {
      background: rgba(52, 199, 89, 0.07);
      border: 1px solid rgba(52, 199, 89, 0.3);
      border-left: 4px solid #34c759;
    }

    .quiz-feedback.bad {
      background: rgba(255, 59, 48, 0.06);
      border: 1px solid rgba(255, 59, 48, 0.25);
      border-left: 4px solid #ff3b30;
    }

    .quiz-feedback .qf-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-feedback.good .qf-title {
      color: #28a745;
    }

    .quiz-feedback.bad .qf-title {
      color: #d0342c;
    }

    .quiz-feedback .qf-reason {
      color: #424245;
      margin-bottom: 8px;
    }

    .quiz-feedback .qf-correct {
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.08);
      color: #1d1d1f;
      margin-top: 8px;
    }

    .quiz-feedback .qf-correct strong {
      color: #28a745;
    }

    @keyframes qfFadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 12px;
    }

    .quiz-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 980px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .quiz-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-ring);
    }

    .quiz-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .quiz-btn.secondary {
      background: #ffffff;
      color: var(--accent);
      border: 1.5px solid var(--accent);
    }

    .quiz-complete {
      text-align: center;
      padding: 24px;
    }

    .quiz-complete .qc-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #ffffff;
      font-size: 32px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px var(--accent-ring);
    }

    .quiz-complete h4 {
      font-size: 22px;
      color: #1d1d1f;
      margin: 0 0 8px;
    }

    .quiz-complete p {
      color: #6e6e73;
      margin: 0 0 18px;
      font-size: 15px;
    }

    /* =========================================================
     STRIKE VISUAL REFINEMENT PASS
     Darker cards, brighter text, richer blue accents,
     improved sidebar/tabs/tables, subtle texture, more spacing.
     ========================================================= */

    :root {
      --strike-card-top: #101722;
      --strike-card-bottom: #0b1119;
      --strike-card-alt: #111b28;

    function renderQuiz(quizId) {
      const quiz = QUIZ[quizId];
      if (!quiz) return '';
      const qHtml = quiz.questions.map((q, qi) => {
        const opts = q.options.map((o, oi) => {
          const letter = ['A', 'B', 'C', 'D', 'E'][oi];
          return `
        <button type="button" class="quiz-opt" data-q="${qi}" data-o="${oi}" data-correct="${o.c ? '1' : '0'}">
          <span class="opt-letter">${letter}</span>
          <span class="opt-text">${o.t}</span>
        </button>
      `;
        }).join('');
        const correctIdx = q.options.findIndex(o => o.c);
        const correctLetter = ['A', 'B', 'C', 'D', 'E'][correctIdx];
        const correctText = q.options[correctIdx].t;
        const correctWhy = q.options[correctIdx].why;
        return `
      <div class="quiz-item" data-qi="${qi}" style="margin-bottom:28px;">
        <div class="quiz-progress">Question ${qi + 1} of ${quiz.questions.length}</div>
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-options">${opts}</div>
        <div class="quiz-feedback" data-qi="${qi}"
             data-correct-letter="${correctLetter}"
             data-correct-text="${correctText.replace(/"/g, '&quot;')}"
             data-correct-why="${correctWhy.replace(/"/g, '&quot;')}"></div>
      </div>
    `;
      }).join('');

      return `
    <div class="quiz-block" id="quiz-${quizId}">
      <div class="quiz-header">
        <div class="quiz-icon">${quiz.icon}</div>
        <h3>${quiz.title}</h3>
      </div>
      <p class="quiz-sub">${quiz.subtitle}</p>
      ${qHtml}
      <div class="quiz-nav">
        <button type="button" class="quiz-btn secondary" data-quiz-reset="${quizId}">Reset quiz</button>
        <div style="font-size:13px;color:#6e6e73;">No scoring. Practice as many times as you want.</div>
      </div>
    </div>
  `;
    }

    function bindQuizHandlers() {
      document.querySelectorAll('.quiz-opt').forEach(btn => {
        if (btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', function () {
          const item = this.closest('.quiz-item');
          if (!item) return;
          const isCorrect = this.dataset.correct === '1';
          const optText = this.querySelector('.opt-text')?.textContent?.trim() || '';
          const pickedIdx = parseInt(this.dataset.o, 10);
          const quizBlock = this.closest('.quiz-block');
          const quizId = quizBlock ? quizBlock.id.replace('quiz-', '') : null;
          const quizData = quizId ? QUIZ[quizId] : null;
          const qi = parseInt(item.dataset.qi, 10);
          const pickedReason = quizData ? quizData.questions[qi].options[pickedIdx].why : '';

          // disable all in this question + color them
          item.querySelectorAll('.quiz-opt').forEach(b => {
            b.disabled = true;
            if (b.dataset.correct === '1') b.classList.add('correct');
          });
          if (!isCorrect) this.classList.add('wrong');

          const feedback = item.querySelector('.quiz-feedback');
          const correctLetter = feedback.dataset.correctLetter;
          const correctText = feedback.dataset.correctText;
          const correctWhy = feedback.dataset.correctWhy;

          if (isCorrect) {
            feedback.classList.remove('bad');
            feedback.classList.add('good', 'show');
            feedback.innerHTML = `
          <div class="qf-title">✓ Nailed it.</div>
          <div class="qf-reason">${pickedReason}</div>
        `;
          } else {
            feedback.classList.remove('good');
            feedback.classList.add('bad', 'show');
            feedback.innerHTML = `
          <div class="qf-title">✕ Not quite.</div>
          <div class="qf-reason"><strong>Why that's a trap:</strong> ${pickedReason}</div>
          <div class="qf-correct"><strong>Correct: ${correctLetter}) ${correctText}</strong><br>${correctWhy}</div>
        `;
          }
        });
      });

      document.querySelectorAll('[data-quiz-reset]').forEach(btn => {
        if (btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', function () {
          const quizId = this.dataset.quizReset;
          const block = document.getElementById('quiz-' + quizId);
          if (!block) return;
          block.querySelectorAll('.quiz-opt').forEach(b => {
            b.disabled = false;
            b.classList.remove('correct', 'wrong');
          });
          block.querySelectorAll('.quiz-feedback').forEach(f => {
            f.classList.remove('show', 'good', 'bad');
            f.innerHTML = '';
          });
          block.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      document.querySelectorAll('.self-check-item').forEach(el => {
        if (el.dataset.bound === '1') return;
        el.dataset.bound = '1';
        el.addEventListener('click', function () { this.classList.toggle('checked'); });
      });
    }

    function renderSidebar() {
      const section = nav.find(n => n.id === currentSection);
      const sb = document.getElementById('sidebar');
      if (!section.hasSidebar) {
        sb.classList.remove('visible');
        sb.innerHTML = '';
        return;
      }
      sb.classList.add('visible');

      // Check if currentSub belongs to a nested group
      const isNestedActive = (s) => s.nested && s.nested.some(n => n.id === currentSub);

      sb.innerHTML = `
    <h4>${section.label}</h4>

          const groupActive = isNestedActive(s) || currentSub === s.id;
          return `

            ${s.label}
            ${!groupActive && s.status === 'soon' ? '<span class="status">soon</span>' : ''}

            <button class="sidebar-link ${currentSub === n.id ? 'active' : ''}" data-id="${n.id}" style="padding-left:28px;font-size:13px;">
              ${n.label}
              ${n.status === 'soon' ? '<span class="status">soon</span>' : ''}
            </button>
          `).join('') : ''}
        `;

        return `
        <button class="sidebar-link ${currentSub === s.id ? 'active' : ''}" data-id="${s.id}">
          ${s.label}
          ${s.status === 'soon' ? '<span class="status">soon</span>' : ''}

          render();
        });

    <div class="section-tag">What we expect</div>
    <h2 style="font-size:26px;color:#1d1d1f;margin:4px 0 14px;">The Non-Negotiables</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.6;margin-bottom:18px;">A few things are non-negotiable from day one:</p>
    <div class="flow-diagram">
      <div class="flow-step">
        <div class="flow-num">1</div>
        <h4>20 hrs/week on the dialer</h4>
        <p>Under it occasionally, that's life. Under it repeatedly, that's a problem. Reps who crush it are usually well above this.</p>
      </div>
      <div class="flow-step">
        <div class="flow-num">2</div>
        <h4>Strong work ethic</h4>
        <p>Show up, plug in, do the work. The hustle has to come from you.</p>
      </div>
      <div class="flow-step">
        <div class="flow-num">3</div>
        <h4>Positive attitude</h4>
        <p>Your energy affects everyone around you. Bring it up — don't drag it down.</p>
      </div>
      <div class="flow-step">
        <div class="flow-num">4</div>
        <h4>Be a teammate</h4>
        <p>This floor runs on momentum. Reps who engage, share wins, and lean into the team ramp fastest.</p>
      </div>
    </div>

    <div class="section-tag">Pipeline</div>
    <h2 style="font-size:26px;color:#1d1d1f;margin:22px 0 10px;">Build the pipeline — ABB</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Sale floors operate on a pipeline. The work you do this week doesn't pay you this week — it pays you weeks later, when those deals actually close and activate.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Here's why there's a lag: most customers take four to six touches before they sign up. They need to think it over, talk to a spouse, wait for a contract to end, take a follow-up call, see a second offer. That process takes time.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:16px;">The power of being a setter on this floor is that you have an entire team behind you doing that follow-up on your behalf. Every lead you generate today gets worked by closers, managers, and our follow-up process for weeks after you hand it off. Your job is to keep feeding the pipeline. The team takes it from there.</p>

    <div class="pull-quote">
      ABB — Always Be Building. A slow week now is a thin paycheck later. A strong week now is a strong check at month's end. The reps who keep the hopper full — even on the days they don't feel like it — are the ones who build real, consistent income here.
      <cite>— The one rule that pays the bills</cite>
    </div>

    <div class="section-tag">The ground truth</div>
    <h2 style="font-size:26px;color:#1d1d1f;margin:22px 0 10px;">The one thing we can't train</h2>
    <div class="pull-quote">
      Work ethic is the one thing we cannot train. If you plug into the systems and put in the time, you will succeed. If you work sporadically and complain, you will be cut from the team. No exceptions.
    </div>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">Everything else — the pitch, the product, the objection handling, the dialer — we can teach you. Work ethic you have to bring with you.</p>

    <div class="section-tag">CRM Standards</div>
    <h2 style="font-size:26px;color:#1d1d1f;margin:22px 0 10px;">Notes on Every Call</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">Every call must be documented in GoHighLevel. Before moving on to the next lead, confirm that the customer’s profile includes their full name, phone number, and exact service address, including the apartment or unit number when applicable. Your notes must include the call-attempt number, provider pitched, current provider, approximate monthly bill, primary concern, household internet use, appointment details, and the customer’s response. Complete records allow the closer to continue the conversation without making the customer repeat themselves.</p>

    <div class="section-tag">Communication</div>
    <h2 style="font-size:26px;color:#1d1d1f;margin:22px 0 10px;">Stay plugged into Slack</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;"><strong>Slack</strong> is the app we use for everything company-wide: meetings, updates, check-ins, and announcements. Stay logged in and stay engaged.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">Company meetings, pipeline updates, trainings, heads-ups from leadership — it all flows through Slack. Missing Slack means missing the information you need to do your job.</p>

    <div class="section-tag">Team</div>
    <h2 style="font-size:26px;color:#1d1d1f;margin:22px 0 10px;">When one person wins, we all win</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">This floor is a team, not a collection of individuals. When somebody on the team hits a big day, that's a good day for all of us — it sets the bar, shows what's possible, and builds the momentum everyone else rides.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Support your teammates. Celebrate their wins. Help each other out. Get to know the people next to you.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">It doesn't matter if you've been in sales for a decade or today is your first day on a dialer — everyone on this floor has something to learn from everyone else. The ten-year rep might pick up a tone or transition from the way a new hire opens a call. The new hire might hear one line from a veteran that changes their whole pitch. Stay curious. Stay humble. Lean in.</p>

    <div class="insight-card">

      <h2>Call Recording — Why Every Call Is Recorded</h2>

      <h4>Why recording protects you</h4>
      <ul>

      <h4>The two-party consent issue</h4>

    <section class="cmp-section" id="cmp-sms-consent" data-sub="sms-consent">
      <span class="cmp-tag">Section 4</span>
      <h2>SMS Consent — Getting Permission Before the Text</h2>
      <p>Our GoHighLevel workflow sends an automated confirmation text to every booked appointment. Under TCPA and A2P 10DLC rules, <strong>we are not allowed to send that text unless the prospect has verbally consented on the recorded line.</strong> The consent is what makes the text legal. No consent = no text, no exceptions.</p>
      <h4>The exact consent ask</h4>
      <div class="cmp-quote">"Is it okay if I send you a quick confirmation text?"</div>
      <p>You need a clear, affirmative "yes" on the recording. Silence is not consent. A mumble is not consent. "I guess" is not consent. If you didn't get a clean yes, the text doesn't go.</p>
      <h4>What goes out (for your awareness)</h4>
      <p>Two automated messages, ~60 seconds apart:</p>
      <div class="cmp-quote">Msg 1: "Hi [First], [Setter] here — just confirming [Closer] will be calling you tomorrow between [Time] and [Time]. He's going to take a look at your current setup and see if there's anything costing you more than it should. Reply STOP to opt out."</div>
      <div class="cmp-quote">Msg 2: "No pressure either way — at least you'll know where you stand."</div>
      <div class="cmp-callout"><strong>Your job:</strong> get the verbal consent on tape, then book the appointment in GHL. The system sends the text automatically. No consent on tape = no booking, full stop.</div>
      <h4>If they say no to the text — the appointment does not get booked</h4>
      <p>This is a hard rule. The confirmation text is not optional, and there's no way to turn it off on a per-appointment basis. If the prospect refuses consent for the text message, you <strong>cannot book the appointment.</strong> What you can do is set it as a callback.</p>
      <ul>
        <li>Don't make it awkward. "No worries — I won't send anything over."</li>
        <li>Do not book the appointment in GHL. The text will fire automatically on any booked appointment, and firing it without consent is a TCPA violation.</li>
        <li>Pivot to a callback instead: "Why don't I just plan to give you a quick call back tomorrow around [time] — does that work?" not a booked appointment.</li>
        <li>Disposition the call appropriately so the callback routes correctly.</li>
      </ul>
      <div class="cmp-danger"><strong>Never book an appointment without the verbal text consent on tape.</strong> The GHL text fires on every booked appointment — there is no manual override. A booked appointment without consent on tape = a TCPA violation waiting to happen. $500–$1,500 per text, per violation, and every court will side with the consumer. Callback or nothing.</div>
    </section>

    <section class="cmp-section" id="cmp-biz-vs-consumer" data-sub="biz-vs-consumer">
      <span class="cmp-tag">Section 5</span>
      <h2>Business vs. Consumer — Huge Legal Difference</h2>
      <p>The TCPA was written primarily to protect consumers — individuals being called on their personal phones. The rules are meaningfully different when you're calling a <strong>published business number</strong>. Knowing which kind of call you're on determines how you handle it.</p>
      <div class="cmp-compare">
        <div class="col biz">
          <h5>📞 Published Business Number</h5>
          <ul>
            <li>A main line the business <strong>publishes publicly</strong> (Google Business Profile, website, storefront signage).</li>
            <li>TCPA protections are much lighter — the business published the number expecting contact.</li>
            <li>National DNC registry does NOT apply to business lines.</li>
            <li>You can still be asked not to call back — and you still must honor that request immediately and permanently.</li>
            <li>You still must disclose the recorded line and identify yourself.</li>
          </ul>
        </div>
        <div class="col consumer">
          <h5>📱 Consumer / Cell Phone</h5>
          <ul>
            <li>A personal cell or residential line belonging to an individual.</li>
            <li>Full TCPA protection applies — this is where the six-figure class actions come from.</li>
            <li>Federal + state DNC registries DO apply.</li>
            <li>Express consent is required for autodialed calls; consent is required for marketing texts.</li>
            <li>Every protection in this module applies in its strictest form.</li>
          </ul>
        </div>
      </div>
      <div class="cmp-callout"><strong>How do I know which one I'm on?</strong> Our leads are sourced from published business data — Google Maps profiles, business directories. That's the <em>intended</em> use case. But people answer their cell phones too, and a lot of small-business owners use their personal cell as the business line. <strong>Default to the stricter rules.</strong> If anything feels off — "how did you get this number?", "this is my personal line," residential ambient noise — treat the call as a consumer call.</div>

    <section class="cmp-section" id="cmp-dnc" data-sub="dnc">
      <span class="cmp-tag">Section 6</span>
      <h2>Do-Not-Call Requests — The One Mistake That Ends Your Career</h2>
      <p>A DNC request is the single most dangerous moment on any call. One mishandled DNC is the thread TCPA attorneys pull on. Handle it right, every time, or don't make calls at all.</p>
      <h4>What counts as a DNC request</h4>
      <p>Any of these — regardless of tone, regardless of whether they're polite — are a DNC request:</p>
      <ul>
        <li>"Put me on your do-not-call list."</li>
        <li>"Don't call me again."</li>
        <li>"Take me off your list."</li>
        <li>"Stop calling."</li>
        <li>"I don't want to be contacted."</li>
        <li>"Remove my number."</li>
        <li>Anything substantively equivalent, in any tone, even when mixed with profanity.</li>
      </ul>
      <h4>What to do — in this exact order</h4>
      <ul>
        <li><strong>1. Stop pitching immediately.</strong> The second you hear a DNC request, your only job is to end the call cleanly. Don't try one more line. Don't try to save it. Don't explain, don't argue, don't negotiate.</li>
        <li><strong>2. Acknowledge it clearly on the recording.</strong> "Understood, I'll get you taken off our list right now. Sorry to bother you — have a good one." That exact kind of response proves you honored the request.</li>
        <li><strong>3. Disconnect the call.</strong> No further conversation, no small talk, nothing.</li>
        <li><strong>4. Disposition immediately as DNC.</strong> This flags the contact in GHL and triggers our internal DNC sync. That number will never be called by us again.</li>
        <li><strong>5. If they ask who we are or for a manager, give them the company name and offer to transfer. Do not get defensive.</strong></li>
      </ul>
      <div class="cmp-danger"><strong>If you get a DNC and forget to disposition it — the number stays in the dialer. Someone else calls it tomorrow. That's the violation, and it's on you.</strong> Every DNC must be dispositioned before you move to the next call.</div>
      <h4>STOP replies to text messages</h4>
      <p>If a prospect replies STOP to our SMS sequence, that's handled automatically — our GHL workflow tags the contact and syncs the DNC. You don't need to do anything. But know that <strong>a STOP is a permanent DNC across channels</strong> — not just texts, but calls too. That number is burned forever.</p>
    </section>

    <section class="cmp-section" id="cmp-professional" data-sub="professional">
      <span class="cmp-tag">Section 7</span>
      <h2>Staying Professional — Always, Every Call</h2>
      <p>Professionalism is a compliance control, not just a tone preference. A professional call that ends with "no thanks" is a non-event. An unprofessional call that ends the same way is a complaint, a BBB filing, or a lawsuit.</p>
      <h4>The rules</h4>
      <ul>
        <li><strong>Never argue.</strong> If a prospect gets hostile, you stay level. One response, then you're off the call.</li>
        <li><strong>Never match their tone down.</strong> If they curse at you, you do not curse back. You stay professional, and you end the call politely.</li>
        <li><strong>Never make threats, guarantees, or deceptive claims.</strong> Don't say "you're going to lose service," "you have to switch," "the government is changing the rules," or anything similar. We sell on facts.</li>
        <li><strong>Never impersonate anyone.</strong> Not the customer's carrier, not a utility, not a government agency, not a survey company, not a former coworker — nothing.</li>
        <li><strong>Never try to "pressure past" a no.</strong> One objection response, then move on. Ignoring a clear no is a TCPA hazard and a reputation hazard.</li>
        <li><strong>Never make personal comments.</strong> About their voice, their situation, where they live, their business, anything. Keep it about the offer.</li>
        <li><strong>If you're having a bad day — take five.</strong> Make the next call fresh. A bad call because you're venting is a complaint waiting to happen.</li>
      </ul>
      <div class="cmp-callout"><strong>The test:</strong> if a transcript of the call were read out loud in a courtroom, would you be comfortable with every line? If not — don't say it on the phone.</div>
    </section>

    <section class="cmp-section" id="cmp-red-flags" data-sub="red-flags">
      <span class="cmp-tag">Section 8</span>
      <h2>Red Flags & Escalation</h2>
      <p>A small number of calls every week will have a signal that something's off. Knowing them — and what to do — keeps a bad situation from getting worse.</p>
      <h4>Red-flag language to listen for</h4>
      <ul>
        <li>"I'm recording this call" — fine, continue normally, keep it clean. Say "understood, I'm recording too." Stay especially tight on protocol.</li>
        <li>"I'm an attorney" — stay calm, professional, short. Offer to transfer to a manager.</li>
        <li>"This is my personal cell" — treat as consumer, follow DNC protocol if they ask not to be called.</li>
        <li>"How did you get my number?" — truthful answer: "Your number is listed publicly as a business contact. If you'd like me to remove it from our list, I can do that right now."</li>
        <li>"I'm on the do-not-call list" — treat as an active DNC request, honor immediately.</li>

      </ul>
      <h4>When to escalate to a manager</h4>
      <ul>
        <li>Any threat of legal action, BBB complaint, state AG complaint, or attorney contact.</li>
        <li>Any prospect claiming we have called them repeatedly after a DNC.</li>
        <li>Any prospect who says "I reported this number" or "I already filed a complaint."</li>
        <li>Any call where you think you may have made a mistake on the protocol (missed the disclosure, sent a text without consent, etc.). It's always safer for the company to know immediately.</li>

    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Think about that for a second, because you've lived it a thousand times.</p>

    <div class="sec-hero">
      <div class="crumb">The Pitch · Handling Objections · Questions</div>
      <span class="sec-tag">The Buying Signal</span>
      <h1>Questions</h1>
      <p class="lead">Questions are what you're listening for. A customer asking questions is a customer who's engaged, thinking logistically, and considering how this would actually work for them. That's a buying signal — embrace it.</p>

    <h2 style="font-size:24px;color:#1d1d1f;margin:4px 0 10px;">Why Questions Are a Good Sign</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">If you have a customer who's not asking you any sort of questions — just going with the flow, agreeing with everything — those are the customers you need to take a step back and dig into. Silence isn't agreement; it's usually indifference. The customer who asks questions is the one who's actually considering it.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">Think about every time you've bought something serious. the internet is a huge part of our lives — did you decide who to go with without asking a single question? If you walked into a car dealership, wouldn't you ask about gas mileage, how many miles it has, how it drives? You ask questions every time you're genuinely considering a purchase. Your customers are doing the exact same thing.</p>

    <ul style="color:#1d1d1f;font-size:15.5px;line-height:1.8;margin:0 0 16px;padding-left:22px;">

    <div class="section-tag">The play</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 14px;">The Pattern: Question → Short Answer → Question</h2>
