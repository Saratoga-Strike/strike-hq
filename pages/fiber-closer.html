<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strike Mobile Closer Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.68;
    overflow-x: hidden;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============ TOP NAV ============ */
  .topnav {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid #d2d2d7;
    padding: 0 36px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    min-height: 64px;
    gap: 24px;
  }
  .brand { display: flex; flex-direction: column; flex-shrink: 0; padding: 12px 0; }
  .brand .label { color: #86868b; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  .brand .name { font-size: 17px; color: #1d1d1f; font-weight: 700; letter-spacing: 0.2px; }
  .topnav-links { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 0; }
  .topnav-link {
    background: transparent; border: none; color: #86868b;
    padding: 8px 16px; border-radius: 980px; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all 0.2s; white-space: nowrap;
  }
  .topnav-link:hover { color: #1d1d1f; background: rgba(0, 0, 0, 0.04); }
  .topnav-link.active { color: #fff; background: #0071e3; }

  /* ============ LAYOUT ============ */
  .main-wrap { display: flex; min-height: calc(100vh - 64px); }
  .sidebar {
    width: 248px; background: #ffffff; border-right: 1px solid #d2d2d7;
    padding: 28px 16px; flex-shrink: 0; display: none;
  }
  .sidebar.visible { display: block; }
  .sidebar h4 {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #86868b; margin-bottom: 14px; font-weight: 700; padding: 0 14px;
  }
  .sidebar-link {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    color: #424245; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 500; margin-bottom: 2px; transition: all 0.15s; line-height: 1.4;
  }
  .sidebar-link:hover { background: rgba(0, 0, 0, 0.04); color: #1d1d1f; }
  .sidebar-link.active { background: #0071e3; color: #fff; font-weight: 600; }
  .content { flex: 1; padding: 48px 56px; max-width: 1080px; margin: 0 auto; width: 100%; }

  /* ============ HERO / HOME ============ */
  .hero { padding: 40px 0 56px; text-align: center; border-bottom: 1px solid #d2d2d7; margin-bottom: 48px; }
  .hero .eyebrow { color: #0071e3; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 14px; }
  .hero h1 { font-size: 50px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 16px; }
  .hero .sub { color: #86868b; font-size: 19px; max-width: 700px; margin: 0 auto; line-height: 1.5; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; margin: 32px 0; }
  .nav-card {
    background: #fff; border: 1px solid #e5e5ea; border-radius: 18px; padding: 26px 24px;
    cursor: pointer; transition: all 0.2s; text-align: left;
  }
  .nav-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.08); border-color: #d2d2d7; }
  .nav-card .kicker { color: #0071e3; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
  .nav-card h3 { font-size: 21px; margin-bottom: 8px; letter-spacing: -0.2px; }
  .nav-card p { color: #6e6e73; font-size: 14.5px; }

  /* ============ CONTENT TYPOGRAPHY ============ */
  .eyebrow-sm { color: #0071e3; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; }
  .page-h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  .page-lead { color: #6e6e73; font-size: 19px; margin-bottom: 36px; max-width: 760px; line-height: 1.5; }
  .content h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; margin: 40px 0 14px; }
  .content h3 { font-size: 19px; font-weight: 700; margin: 28px 0 10px; }
  .content p { margin-bottom: 14px; color: #2b2b2f; }
  .content ul, .content ol { margin: 0 0 16px 22px; }
  .content li { margin-bottom: 8px; color: #2b2b2f; }
  .content strong { font-weight: 650; color: #1d1d1f; }
  .lead-in { font-size: 17px; }

  /* ============ TABLES ============ */
  table { width: 100%; border-collapse: collapse; margin: 18px 0 24px; font-size: 14.5px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 0 #e5e5ea; }
  th { background: #f5f5f7; text-align: left; padding: 12px 16px; font-weight: 700; font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase; color: #6e6e73; border-bottom: 1px solid #e5e5ea; }
  td { padding: 13px 16px; border-bottom: 1px solid #f0f0f2; vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  /* ============ CALLOUTS ============ */
  .callout { border-radius: 14px; padding: 18px 22px; margin: 20px 0; border: 1px solid #e5e5ea; background: #fff; }
  .callout .ttl { font-weight: 700; font-size: 14px; letter-spacing: 0.3px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .callout p:last-child { margin-bottom: 0; }
  .callout ul { margin-bottom: 0; }
  .callout.rule { border-left: 4px solid #0071e3; background: #f4f9ff; }
  .callout.rule .ttl { color: #0071e3; }
  .callout.warn { border-left: 4px solid #d97706; background: #fffaf2; }
  .callout.warn .ttl { color: #b45309; }
  .callout.verbatim { border-left: 4px solid #1d1d1f; background: #fafafa; font-style: italic; }
  .callout.verbatim .ttl { color: #1d1d1f; font-style: normal; }
  .callout.source { border-left: 4px solid #34c759; background: #f3fbf5; }
  .callout.source .ttl { color: #248a3d; }

  /* quick reference card */
  .qref { background: #1d1d1f; color: #f5f5f7; border-radius: 16px; padding: 26px 28px; margin: 28px 0; }
  .qref .ttl { color: #5ea9ff; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 14px; }
  .qref h4 { color: #fff; font-size: 16px; margin: 14px 0 6px; }
  .qref ul { margin-left: 20px; }
  .qref li { color: #d2d2d7; margin-bottom: 6px; }
  .qref strong { color: #fff; }
  .qref table { background: transparent; box-shadow: none; }
  .qref th { background: rgba(255,255,255,0.06); color: #8e8e93; border-color: rgba(255,255,255,0.1); }
  .qref td { color: #d2d2d7; border-color: rgba(255,255,255,0.08); }

  /* tags */
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; padding: 3px 9px; border-radius: 980px; margin-left: 8px; vertical-align: middle; }
  .tag.stable { background: #e3f3e7; color: #248a3d; }
  .tag.volatile { background: #fdeccd; color: #b45309; }

  /* source-of-truth chips */
  .sot { display: inline-flex; align-items: center; gap: 6px; background: #eaf4ff; color: #0058b0; border: 1px solid #cde4ff; border-radius: 8px; padding: 2px 9px; font-size: 12.5px; font-weight: 650; }

  /* playbook (collapsible) */
  details.playbook { background: #fff; border: 1px solid #e5e5ea; border-radius: 14px; padding: 4px 22px; margin: 14px 0; }
  details.playbook summary { cursor: pointer; font-weight: 650; padding: 14px 0; list-style: none; font-size: 16px; }
  details.playbook summary::-webkit-details-marker { display: none; }
  details.playbook summary::before { content: "+"; color: #0071e3; font-weight: 700; margin-right: 10px; }
  details.playbook[open] summary::before { content: "–"; }
  details.playbook[open] { padding-bottom: 18px; }

  .pill-note { font-size: 13px; color: #86868b; margin-top: 6px; }
  .divider { height: 1px; background: #e5e5ea; margin: 36px 0; border: none; }
  .footer { color: #86868b; font-size: 13px; text-align: center; padding: 40px 0 10px; border-top: 1px solid #e5e5ea; margin-top: 48px; }
  a.loom { color: #0071e3; font-weight: 600; text-decoration: none; }
  a.loom:hover { text-decoration: underline; }

  /* launch button (open tool), download button, video embed */
  .launch-btn { display: inline-block; background: #0071e3; color: #fff; font-weight: 600; font-size: 14.5px; padding: 10px 20px; border-radius: 980px; text-decoration: none; margin: 0 0 26px; transition: background 0.2s; }
  .launch-btn:hover { background: #0058b0; }
  .dl-btn { display: inline-block; background: #fff; color: #0071e3; border: 1.5px solid #0071e3; font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 980px; text-decoration: none; margin: 16px 0 8px; transition: all 0.2s; }
  .dl-btn:hover { background: #0071e3; color: #fff; }
  .video-wrap { margin: 20px 0 8px; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.10); }

  @media (max-width: 820px) {
    .sidebar { display: none !important; }
    .content { padding: 32px 22px; }
    .hero h1 { font-size: 36px; }
    .page-h1 { font-size: 30px; }
  }

  /* ============================================================
     STRIKE MOBILE CLOSER — ONYX + GOLD THEME
     Brand/theme pass only. Original content + behavior preserved.
     ============================================================ */
  :root {
    --strike-bg: #050505;
    --strike-bg-2: #090a0c;
    --strike-panel: #0e1013;
    --strike-panel-2: #14171b;
    --strike-line: #2b2e33;
    --strike-line-bright: #454a50;
    --strike-text: #f5f5f7;
    --strike-muted: #a9adb3;
    --strike-muted-2: #7d8289;
    --strike-gold: #d6a928;
    --strike-gold-bright: #f2c84b;
    --strike-gold-soft: rgba(214, 169, 40, 0.13);
    --strike-gold-glow: rgba(242, 200, 75, 0.22);
    --strike-success: #52b788;
  }

  html { color-scheme: dark; }

  body {
    background:
      linear-gradient(rgba(3,3,4,.76), rgba(3,3,4,.88)),
      radial-gradient(circle at 50% -10%, rgba(214,169,40,0.10), transparent 34%),
      url("../assets/backgrounds/closer%20background.webp") center / cover fixed no-repeat,
      #050505;
    color: var(--strike-text);
  }

  .topnav {
    background: rgba(7,8,10,.94);
    border-bottom: 1px solid var(--strike-line);
    box-shadow: 0 10px 34px rgba(0,0,0,.34);
  }

  .strike-brand {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 8px 0;
    min-width: 235px;
  }

  .strike-brand-logo {
    display: block;
    width: 72px;
    height: 46px;
    object-fit: contain;
    object-position: center;
    flex-shrink: 0;
    filter:
      drop-shadow(0 0 8px rgba(242,200,75,.20))
      drop-shadow(0 0 16px rgba(214,169,40,.10));
  }

  .strike-brand-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.15;
  }

  .strike-brand-kicker {
    color: #d5d8de;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2.1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .brand .name {
    color: var(--strike-text);
    font-size: 17px;
    font-weight: 750;
    letter-spacing: .2px;
  }

  .topnav-link { color: var(--strike-muted); }
  .topnav-link:hover { color: var(--strike-text); background: rgba(255,255,255,.055); }
  .topnav-link.active {
    color: #0a0a0a;
    background: linear-gradient(135deg, var(--strike-gold-bright), #b98912);
    box-shadow: 0 0 22px var(--strike-gold-glow);
  }

  .sidebar {
    background: rgba(9,10,12,.92);
    border-right: 1px solid var(--strike-line);
  }
  .sidebar h4 { color: var(--strike-gold); }
  .sidebar-link { color: #c3c6ca; }
  .sidebar-link:hover { background: rgba(255,255,255,.055); color: #fff; }
  .sidebar-link.active {
    background: linear-gradient(135deg, rgba(242,200,75,.95), rgba(185,137,18,.96));
    color: #090909;
    box-shadow: 0 0 20px rgba(214,169,40,.14);
  }

  .hero { border-bottom-color: var(--strike-line); }
  .hero .eyebrow, .eyebrow-sm, .nav-card .kicker { color: var(--strike-gold-bright); }

  .hero h1, .page-h1, .content h2, .content h3 { color: var(--strike-text); }
  .hero .sub, .page-lead { color: var(--strike-muted); }
  .content p, .content li { color: #c3c6ca; }
  .content strong { color: #fff; }

  .nav-card,
  .callout,
  details.playbook,
  table {
    background: linear-gradient(145deg, rgba(255,255,255,.025), transparent 50%), var(--strike-panel);
    border-color: var(--strike-line);
    color: var(--strike-text);
    box-shadow: 0 10px 30px rgba(0,0,0,.22);
  }

  .nav-card:hover {
    border-color: rgba(214,169,40,.55);
    box-shadow: 0 12px 34px rgba(0,0,0,.35), 0 0 22px rgba(214,169,40,.08);
  }
  .nav-card p { color: var(--strike-muted); }

  table { box-shadow: none; }
  th {
    background: #15171a;
    color: #d0d3d7;
    border-bottom-color: var(--strike-line);
  }
  td {
    color: #c7c9cd;
    border-bottom-color: #202328;
  }

  .callout.rule {
    border-left-color: var(--strike-gold);
    background: rgba(214,169,40,.075);
  }
  .callout.rule .ttl { color: var(--strike-gold-bright); }

  .callout.warn {
    border-left-color: #d49a28;
    background: rgba(212,154,40,.08);
  }
  .callout.warn .ttl { color: #e6b34d; }

  .callout.verbatim {
    border-left-color: #d6d6d8;
    background: rgba(255,255,255,.035);
  }
  .callout.verbatim .ttl { color: #f4f4f5; }

  .callout.source {
    border-left-color: var(--strike-success);
    background: rgba(82,183,136,.07);
  }
  .callout.source .ttl { color: #74c69d; }

  .qref {
    background:
      radial-gradient(circle at 100% 0%, rgba(214,169,40,.12), transparent 34%),
      linear-gradient(145deg, #17191d, #0b0c0e);
    border: 1px solid var(--strike-line-bright);
    box-shadow: 0 18px 42px rgba(0,0,0,.34);
  }
  .qref .ttl { color: var(--strike-gold-bright); }
  .qref h4, .qref strong { color: #fff; }
  .qref li, .qref td { color: #d0d2d5; }
  .qref th { background: rgba(255,255,255,.055); color: #aeb2b7; }

  .tag.stable { background: rgba(82,183,136,.13); color: #74c69d; }
  .tag.volatile { background: rgba(214,169,40,.12); color: var(--strike-gold-bright); }

  .sot {
    background: rgba(214,169,40,.10);
    color: var(--strike-gold-bright);
    border-color: rgba(214,169,40,.28);
  }

  details.playbook summary::before { color: var(--strike-gold-bright); }

  .pill-note, .footer { color: var(--strike-muted-2); }
  .divider { background: var(--strike-line); }
  .footer { border-top-color: var(--strike-line); }

  a.loom { color: var(--strike-gold-bright); }

  .launch-btn {
    background: linear-gradient(135deg, var(--strike-gold-bright), #ad7f10);
    color: #090909;
    box-shadow: 0 0 20px rgba(214,169,40,.12);
  }
  .launch-btn:hover { background: linear-gradient(135deg, #ffdc67, #c49316); }

  .dl-btn {
    background: transparent;
    color: var(--strike-gold-bright);
    border-color: var(--strike-gold);
  }
  .dl-btn:hover { background: var(--strike-gold); color: #090909; }

  .video-wrap {
    box-shadow: 0 8px 30px rgba(0,0,0,.42);
    border: 1px solid var(--strike-line);
  }

  input, select, textarea {
    background: var(--strike-panel);
    color: var(--strike-text);
    border-color: var(--strike-line);
  }

  ::selection { background: rgba(242,200,75,.30); color: #fff; }

  @media (max-width: 820px) {
    .strike-brand-logo {
      width: 58px;
      height: 40px;
    }
    .strike-brand-kicker {
      font-size: 9px;
      letter-spacing: 1.6px;
      margin-bottom: 4px;
    }
    .strike-brand .name {
      font-size: 14px;
    }
  }

</style>
</head>

  <nav class="topnav">
    <div class="brand strike-brand">
      <img
        class="strike-brand-logo"
        src="../assets/logo/strike-logo-gold.webp"
        alt="Strike"
      >
      <div class="strike-brand-copy">
        <span class="strike-brand-kicker">STRIKE SYSTEMS</span>
        <span class="name">Mobile Closer Hub</span>
      </div>
    </div>
    <div class="topnav-links" id="topnav-links"></div>
  </nav>
  <div class="main-wrap">
    <aside class="sidebar" id="sidebar">
      <h4 id="sidebar-title"></h4>
      <div id="sidebar-links"></div>
    </aside>
    <main class="content" id="content"></main>
  </div>

<script>
/* =========================================================================
   CLOSER HUB — content model. Builds ON TOP of the Setter Hub (assumes mastery).
   Volatile specifics (prices, promos, device models) are NOT baked in — they
   route to the two sources of truth: MST (live quote) + Knowledge Plus (rules).
   ========================================================================= */

const HUB = [
{
  id: "overview", label: "Overview", solo: true,
  subs: [{ id: "home", label: "Home", html: `
    <div class="hero">
            <h1>Three Stages. Ten Minutes.<br>Signed Customer.</h1>
      <p class="sub">Everything you need to take a booked appointment and turn it into a clean, closed deal — the pitch, the products, and the software.</p>
    </div>

    <div class="callout rule">
      <div class="ttl">Before you use this hub</div>
      <p>You're expected to have already mastered the <a class="loom" href="mobile-setter.html">Setter Hub</a> — the pitch fundamentals, the competition, objections, compliance basics. This hub assumes that foundation and adds the closer layer on top.</p>
    </div>

    <h2>Where do you want to go?</h2>
    <div class="card-grid">
      <button class="nav-card" data-go="sale.mindset"><div class="kicker">The Sale</div><h3>Closer Mindset</h3><p>You gotta want the deal. The mental game that signs customers.</p></button>
      <button class="nav-card" data-go="sale.framework"><div class="kicker">The Sale</div><h3>The Closing Framework</h3><p>Discovery → Solution → Close. The heart of every call.</p></button>
      <button class="nav-card" data-go="product.devices"><div class="kicker">Product</div><h3>Devices &amp; Porting</h3><p>Locked devices, the trade-in workaround, port protection.</p></button>
      <button class="nav-card" data-go="product.pricing"><div class="kicker">Product</div><h3>Pricing &amp; Promotions</h3><p>The 3-factor model and the 3 device types.</p></button>
      <button class="nav-card" data-go="software.stack"><div class="kicker">Software</div><h3>Your Software Stack</h3><p>Knowledge Plus, MST, SARA Plus, GHL — what each does.</p></button>
      <button class="nav-card" data-go="compliance.home"><div class="kicker">Compliance</div><h3>Compliance</h3><p>Recorded line, ID auth, the verbatims you can't skip.</p></button>
    </div>

    <div class="qref">
      <div class="ttl">The 6 Rules — pin these</div>
      <ul>
        <li><strong>Ask more than you talk.</strong> Talking more than the customer = pitching. Them talking more = selling.</li>
        <li><strong>Smoke screens aren't real.</strong> Ignore them. Next question.</li>
        <li><strong>Price first, features never.</strong> One number. Let them react.</li>
        <li><strong>Silence is a weapon.</strong> Mirror, then shut up.</li>
        <li><strong>Be calm.</strong> Your energy is their energy.</li>
        <li><strong>Ten minutes.</strong> Past fifteen without being in the close? Discovery failed.</li>
      </ul>
    </div>
  `}]
},

/* ============================ THE SALE ============================ */
{
  id: "sale", label: "The Sale",
  subs: [
  { id: "mindset", label: "Closer Mindset", html: `
    <div class="eyebrow-sm">The Sale · Mindset</div>
    <h1 class="page-h1">Closer Mindset</h1>
    <p class="page-lead">The single biggest difference between closers isn't a script. It's whether they actually want the deal.</p>

    <h2>You gotta want the freaking deal</h2>
    <p>Too many times we listen to calls and hear closers invent <strong>excuses in their own head</strong> for why this should be a callback. "The customer is driving." "The customer is busy." Don't. Until they tell you they can't continue — sign them up <em>right now</em>, in this moment.</p>
    <ul>
      <li>Customer's driving? They had time to talk to you. They'll tell you if they truly can't.</li>
      <li>Customer's busy? They'll tell you. Until then, keep going.</li>
      <li>Kids in the background? Not your problem to solve. Keep moving toward the signup.</li>
    </ul>

    <div class="callout rule">
      <div class="ttl">The reframe (small wording, massive difference)</div>
      <p>❌ "What obstacles is this <em>person</em> going to run into while signing up?"</p>
      <p>✅ "What obstacles are in <strong>MY</strong> way to sign this person up?"</p>
      <p>You're not narrating the customer's journey. You're navigating <em>yours</em> to the finish line.</p>
    </div>

    <h2>Don't volunteer the friction</h2>
    <p>As you go through the close, you're hunting for the angle that gets the deal done — you are <strong>not</strong> explaining every challenge the customer might bump into unless they bring it up. The detailed conversation happens at the signup page, <em>after</em> they're already happy with the price. By then it's just details and process — not selling.</p>

    <h3>Worked example — the locked-device customer</h3>
    <p>T-Mobile customer, two iPhones still on payments plus an older one in good shape.</p>
    <ul>
      <li><strong>What you think (internal):</strong> "Even swap on the phones. We'll pay off the old devices and move the job forward."</li>
      <li><strong>What you do NOT do:</strong> pre-explain the T-Mobile installment-lock policy, or open the "well, technically…" monologue.</li>
      <li><strong>What you DO:</strong> find the angle to upgrade — "Hey, we're going to give you a brand new phone for free and pay off the old one." Reframe the obstacle as an upgrade. Move forward.</li>
    </ul>
    <p>What the customer actually needs to hear: <strong>same types of phones, an upgrade, a lower bill.</strong> That's it. The rest is process.</p>

    <div class="qref">
      <div class="ttl">Want-the-deal checklist</div>
      <ul>
        <li>Am I solving <strong>my</strong> obstacles to the signup — or narrating theirs?</li>
        <li>Am I about to volunteer friction they never asked about? Don't.</li>
        <li>Did I invent a reason to make this a callback? Kill it.</li>
        <li>Is there any real reason to get off the phone? If not — sign them up now.</li>
      </ul>
    </div>

    <h2>Call-time playbooks</h2>
    <details class="playbook"><summary>"Customer can't find their porting PIN"</summary>
      <p>Don't bail to a callback. The PIN is recoverable live on the call:</p>
      <ul>
        <li>It's in their <strong>current carrier's app or website</strong> — walk them there.</li>
        <li>They can <strong>call into the carrier</strong> to get it — and when you reach the porting page in SARA Plus, it gives you the number to call.</li>
        <li>Third-party carrier? Call their <strong>general customer service line</strong>.</li>
        <li>Stuck on the steps? <span class="sot">Knowledge Plus</span> has screenshots for every carrier.</li>
      </ul>
      <p>See <strong>Getting the Porting PINs</strong> for the full flow.</p>
    </details>
    <details class="playbook"><summary>"Customer is driving / busy / distracted"</summary>
      <ul>
        <li>Keep your energy calm and low-pressure — your calm becomes their calm.</li>
        <li>Anchor on the win: "It's literally just a few quick questions and I'll have your bill dropped — cool if we knock it out right now?"</li>
        <li>Don't ask permission to stop. Assume forward motion until <em>they</em> stop you.</li>
      </ul>
    </details>
  `},

  { id: "framework", label: "The Closing Framework", html: `
    <div class="eyebrow-sm">The Sale · Framework</div>
    <h1 class="page-h1">The Closing Framework</h1>
    <p class="page-lead">Quick, casual, controlled. The whole call should feel like a conversation with a buddy who knows cell phone plans — not a sales pitch.</p>

    <a class="dl-btn" href="../assets/docs/The%20Closing%20Framework.pdf" target="_blank" rel="noopener">⬇ The Closing Framework (PDF)</a>

    <table>
      <tr><th>Stage</th><th>Purpose</th><th>Time</th></tr>
      <tr><td><strong>Discovery</strong></td><td>Find the pain, dig into it, build emotional weight.</td><td>3–4 min</td></tr>
      <tr><td><strong>Solution</strong></td><td>Recap, confirm, drop the price, shut up.</td><td>3–4 min</td></tr>
      <tr><td><strong>Close</strong></td><td>Collect info, handle objections, sign them up.</td><td>Rest</td></tr>
    </table>

    <h2>Stage 1 · Discovery</h2>
    <p class="lead-in">This is where the sale is won or lost. Your job is to help the customer <strong>feel the weight</strong> of their current situation — not to gather information.</p>
    <h3>The Three Moves</h3>
    <ol>
      <li><strong>Get them to question their loyalty.</strong> Why are they with their carrier? Usually it wasn't a choice — it was inertia.</li>
      <li><strong>Find pain and dig.</strong> Bill too high, dropping calls, old phones. Ask how long. Time amplifies pain.</li>
      <li><strong>Let the weight build.</strong> Mirror what they say, then go quiet. They'll fill the silence with the real answer.</li>
    </ol>
    <table>
      <tr><th>Core Question</th><th>What It Does</th></tr>
      <tr><td>"How long have you had [carrier]?"</td><td>Opens the door to: "What made you sign up with them?"</td></tr>
      <tr><td>"What made you open to taking a look at this?"</td><td>Mirror their answer back and go quiet. The real pain comes next.</td></tr>
      <tr><td>"How's your current setup working for you?"</td><td>Open-ended. Lets them direct where the pain is.</td></tr>
      <tr><td>"Is it more the cost, coverage, or the phones?"</td><td>Forces them to prioritize their own pain.</td></tr>
      <tr><td>"What kind of phones do you have? Still being financed?"</td><td>Situation info + surfaces pain (old/broken phones) <em>and</em> the device-lock picture.</td></tr>
      <tr><td>"How many lines do you have?"</td><td>Follow with: "And all of those are actually in use?"</td></tr>
    </table>
    <div class="callout"><div class="ttl">Digging in — the "how long" technique</div>
      <p>When they hand you a pain point, ask how long. That's it.</p>
      <p>Them: "I've been dropping calls." → You: "How long has that been happening?"<br>
      Them: "I feel like I'm paying too much." → You: "How long have you felt that way?"</p>
    </div>
    <p class="pill-note">One thing to confirm early: make sure you're talking to someone who can actually say yes (the decision-maker). Don't run a full close on someone who has to "check with the owner."</p>

    <h2>Stage 2 · Solution</h2>
    <p class="lead-in">If discovery was done right, this is quick. Four moves:</p>
    <ol>
      <li><strong>Recap the order.</strong> "Sounds like you need two new phones and three lines staying the same. That right?"</li>
      <li><strong>Micro-commitment.</strong> "If we could get you the newest phone at no cost, does that sound like a win?"</li>
      <li><strong>State the price.</strong> One number. No feature dumps. No breakdowns.</li>
      <li><strong>Shut up.</strong> Let them talk first. Answer their clarification simply. Move on.</li>
    </ol>
    <div class="callout rule"><div class="ttl">💡 Pro tip — quote the full price first</div>
      <p>The first price you quote should be the <strong>higher, full price — no promotions</strong>, especially when there's room in their savings. The gap is big enough that even at full price it lands as a win — and it leaves you room to "find" extra promotions as you transition into the close.</p>
    </div>

    <h2>Stage 3 · Close</h2>
    <p class="lead-in">Not a moment. A transition. Sound like you've been here before. Confidence transfers. Hesitation transfers. Pick one.</p>
    <div class="callout warn"><div class="ttl">The Catches Close</div>
      <p>When they're uneasy, volunteer the catches before they ask: "There are a couple catches: this is a promotional rate, you'll trade in your current phones for the free upgrades, and you keep all your same phone numbers — that's required. Are you good with all of that?"</p>
    </div>
    <h3>Soft closes — logistics questions that double as commitment tests</h3>
    <table>
      <tr><th>Question</th><th>What It Really Does</th></tr>
      <tr><td>"Is the business address where you want phones shipped?"</td><td>Assumes they're ordering.</td></tr>
      <tr><td>"Does she want the orange, silver, or deep blue?"</td><td>Picking colors = decided.</td></tr>
      <tr><td>"What's a good email for you?"</td><td>Stealth close — you're collecting info now.</td></tr>
      <tr><td>"Do you have the T-Mobile / Verizon app on your phone?"</td><td>Stealth move into pulling the porting PIN — assumes the deal's done.</td></tr>
    </table>

    <div class="qref">
      <div class="ttl">Quick-ref · the question bank</div>
      <h4>Discovery</h4>
      <ul>
        <li>How long have you had [carrier]? → What made you sign up with them?</li>
        <li>What made you open to taking a look at this? <em>(mirror → silence)</em></li>
        <li>Is it more the cost, coverage, or the phones?</li>
        <li>What phones do you have? Still financed? · How many lines — all in use?</li>
        <li>Any pain point → "How long has that been going on?"</li>
      </ul>
      <h4>Solution</h4>
      <ul><li>Recap → micro-commitment → <strong>one price</strong> (full price first) → shut up.</li></ul>
      <h4>Soft closes</h4>
      <ul><li>Ship address? · Which color? · Good email? · "Got the carrier app handy?"</li></ul>
    </div>
  `},

  { id: "objections", label: "Closing-Stage Objections", html: `
    <div class="eyebrow-sm">The Sale · Objections</div>
    <h1 class="page-h1">Closing-Stage Objections</h1>
    <p class="page-lead">You already learned the smoke-screen framework as a setter. This is how it applies at the close — and the handful of real objections that show up when money's on the table.</p>

    <div class="callout rule"><div class="ttl">The stance (you already know this)</div>
      <p>Most "objections" are <strong>smoke screens</strong> — surface noise, not real resistance. Don't address them, don't argue. <strong>Ask your next question.</strong> A real objection you handle with a <em>question</em> that makes them feel the weight — never a scripted rebuttal.</p>
    </div>

    <h2>Smoke screen vs. real concern</h2>
    <p>A smoke screen evaporates when you ask the next question. A real concern keeps coming back. If it comes back twice, it's real — address it with a question, not a speech.</p>

    <h2>The real ones at the close</h2>
    <table>
      <tr><th>What they say</th><th>Question-based response</th></tr>
      <tr><td>"Let me think about it."</td><td>"Totally fair — when you say think about it, is it the price, or is it whether the switch is worth the hassle?" <em>(makes them name the actual block)</em></td></tr>
      <tr><td>"I need to talk to my [spouse/partner]."</td><td>"Makes sense — if it were just up to you, would you do it?" Then: "What do you think their one question would be?" <em>(surfaces the real objection now)</em></td></tr>
      <tr><td>"The price is too high."</td><td>"Compared to what you're paying now — or compared to what you hoped?" <em>(re-anchors on the pain you already built)</em></td></tr>
      <tr><td>"I've had a bad experience with Verizon before."</td><td>"Was it the service itself, or how they handled something? <em>(listen)</em> Here's how this is different…"</td></tr>
    </table>

    <div class="qref">
      <div class="ttl">Quick-ref</div>
      <ul>
        <li><strong>Heard it once?</strong> Smoke screen. Ask your next question.</li>
        <li><strong>Heard it twice?</strong> Real. Answer with a question that surfaces the block.</li>
        <li><strong>"Think about it" / "talk to spouse"</strong> → "If it were just up to you, would you do it?"</li>
        <li>Never out-talk an objection. The customer talking = selling.</li>
      </ul>
    </div>
  `}
  ]
},

    <div class="eyebrow-sm">Product · Devices</div>
    <h1 class="page-h1">Devices &amp; Porting</h1>
    <p class="page-lead">Two things customers and reps constantly confuse: the <strong>device lock</strong> (the phone) and <strong>port protection</strong> (the number). Keep them separate and you'll never get stuck.</p>

    <h2>Locked devices — and the workaround</h2>
    <p>Most carriers have moved to locked devices. <strong>If the phone is still on an installment plan, it's locked.</strong></p>
    <table>
      <tr><th>Carrier</th><th>The rule</th><th>How often you hit it</th></tr>
      <tr><td><strong>T-Mobile</strong></td><td>On installment = locked until paid off</td><td><strong>100% of the time</strong></td></tr>
      <tr><td><strong>Verizon</strong></td><td>Any phone <strong>purchased in 2026</strong> is locked until paid off</td><td>Common and rising</td></tr>
    </table>

    <div class="callout rule"><div class="ttl">The move: premium device trade-in → pitch UP</div>
      <p>When the device is locked, BYOD is off the table — so trade it in and pitch the <strong>next tier up</strong> from what they have now. They get the upgrade <strong>free</strong> on the trade-in.</p>
      <table>
        <tr><th>They have now</th><th>You pitch</th></tr>
        <tr><td>Base model</td><td>The <strong>Pro</strong></td></tr>
        <tr><td>Pro</td><td>The <strong>Pro Max</strong></td></tr>
      </table>
      <p class="pill-note">Model names move every year — the stable play is "trade in, pitch one tier up, free." Pull current models &amp; trade-in eligibility from <span class="sot">MST</span> + <span class="sot">Knowledge Plus</span>.</p>
    </div>

    <h2>Port protection — separate from the device</h2>
    <p>This is about the <strong>number</strong>, not the phone. Carriers <strong>cannot legally stop a customer from porting their number</strong> — owing money on a device or being past-due <em>does not matter</em>. Say that to a customer with full confidence.</p>
    <p><strong>However</strong>, port protection is a feature the customer can have switched <em>on</em> that blocks the port until it's turned off — most common on <strong>T-Mobile</strong> and <strong>Verizon</strong>.</p>
    <div class="callout warn"><div class="ttl">Symptom &amp; fix</div>
      <p>If a port keeps failing in SARA Plus for no clear reason — check port protection first. Clear it by toggling it off in the carrier's app, or calling the carrier. (<span class="sot">Knowledge Plus</span> has the per-carrier steps.)</p>
    </div>

    <h2>The two camps — read the customer first</h2>
    <ol>
      <li><strong>Premium → trade-in path.</strong> Has a high-end phone (even locked, trade-in still works) and wants an upgraded version. Lean into trade-in; show the new flagship at little/no cost.</li>
      <li><strong>Tiered / cheap path.</strong> Nothing tradeable, or doesn't care about flagships. Push tiered or BYOD. Don't force a flagship pitch on them.</li>
    </ol>
    <p>The mistake is putting a Camp-2 customer on a flagship pitch, or vice versa.</p>

    <div class="qref"><div class="ttl">Quick-ref</div>
      <ul>
        <li><strong>Device locked?</strong> (on installment) → can't BYOD → trade in &amp; pitch one tier up, free.</li>
        <li><strong>T-Mobile installment = locked, every time.</strong> Verizon 2026 phones = locked.</li>
        <li><strong>The number is ALWAYS portable</strong> — debt/past-due is irrelevant.</li>
        <li><strong>Port keeps failing?</strong> → port protection is on. Toggle off in the app or call the carrier.</li>
      </ul>
    </div>
  `},

  { id: "pricing", label: "Pricing & Promotions", html: `
    <div class="eyebrow-sm">Product · Pricing</div>
    <h1 class="page-h1">Pricing &amp; Promotions</h1>
    <p class="page-lead">You don't memorize prices — they change. You understand <em>how a price is built</em>, then pull the real number from MST. Here's the model.</p>

    <div class="callout rule"><div class="ttl">Where the real numbers live</div>
      <p>Every dollar figure comes from <span class="sot">MST</span> (the live quote) and <span class="sot">Knowledge Plus</span> (current promos, tiered device pricing, trade-in eligibility). This page teaches the <em>shape</em>; those two are the source of truth.</p>
    </div>

    <h2>Every quote is built from 3 factors</h2>
    <ol>
      <li><strong>Baseline plan cost.</strong> Price per line drops progressively as you add lines from 1 → 4. <strong>The 4th line gives the biggest per-line discount</strong> — that's the sweet spot to aim a customer toward.</li>
      <li><strong>Device.</strong> Are they getting a new phone? And if so, which promo type — <strong>tiered</strong> or <strong>trade-in</strong>? (Or BYOD = no device cost at all.)</li>
      <li><strong>Promotions.</strong> What unlocks them: <strong>are they porting a number?</strong> And which device path — <strong>BYOD vs. tiered vs. premium trade-in?</strong></li>
    </ol>

    <h2>The 3 device options</h2>
    <table>
      <tr><th>Type</th><th>Device cost</th><th>Trade-in?</th><th>Where to confirm</th></tr>
      <tr><td><strong>BYOD</strong></td><td><strong>Zero</strong> — bring your own (unlocked) device</td><td>No</td><td>—</td></tr>
      <tr><td><strong>Tiered</strong></td><td>Significantly reduced, varies by phone</td><td><strong>No</strong></td><td><span class="sot">Knowledge Plus</span> (current tiered pricing)</td></tr>
      <tr><td><strong>Premium Trade-In</strong></td><td>Sometimes free, sometimes deeply reduced</td><td><strong>Yes — required</strong></td><td><span class="sot">MST</span> + <span class="sot">Knowledge Plus</span> (eligibility + promos)</td></tr>
    </table>
    <p class="pill-note">Maps onto the two camps: Camp 1 (premium → trade-in), Camp 2 (cheap/no-trade → tiered or BYOD).</p>

    <h2>Promotions come in two flavors</h2>
    <ul>
      <li><strong>One-time reward cards</strong> (gift cards) — switcher device-payoff cards, fiber reward cards. Paid out weeks later; <strong>port-in must complete to qualify</strong>, and there's a claim window.</li>
      <li><strong>Recurring monthly credits</strong> — bundle discounts, AutoPay/Paperless, trade-in line credits. These lower the bill <em>every month</em> — they're what make "your bill goes down" true.</li>
    </ul>

    <div class="callout warn"><div class="ttl">Two things to always set up front</div>
      <p><strong>AutoPay:</strong> $5 off for a debit card, another $5 off from a <strong>checking account</strong>. <strong>Always quote as checking ($10 off)</strong> — the best honest number.</p>
      <p><strong>Timing:</strong> credits can take <strong>2–3 months</strong> to appear on the bill, but they're <strong>backdated</strong> — the customer doesn't lose the value. Say this up front so a delayed credit never looks like a broken promise.</p>
    </div>

    <div class="qref"><div class="ttl">Quick-ref · build any quote</div>
      <ul>
        <li><strong>1) Baseline</strong> — push toward 4 lines (biggest per-line discount).</li>
        <li><strong>2) Device</strong> — BYOD (free) / tiered (no trade) / premium (trade-in required).</li>
        <li><strong>3) Promos</strong> — porting? device path? → reward cards (one-time) + monthly credits.</li>
        <li><strong>AutoPay</strong> = quote the $10 (checking). <strong>Credits</strong> = 2–3 mo, backdated.</li>
        <li><strong>Real number → MST. Promo rules → Knowledge Plus.</strong></li>
      </ul>
    </div>
  `}
  ]

    <div class="eyebrow-sm">Software · Knowledge Plus</div>
    <h1 class="page-h1">Knowledge Plus</h1>
    <p class="page-lead">AT&amp;T's official resource hub — built and maintained by AT&amp;T. When the answer has to be <em>current and authoritative</em>, it comes from here.</p>
    <a class="launch-btn" href="https://attknowledgeplus.com/" target="_blank">Open Knowledge Plus ↗</a>
    <h2>What it's the source of truth for</h2>
    <ul>
      <li><strong>Current promotions</strong> — what's live right now and the qualifying rules.</li>
      <li><strong>Tiered device pricing</strong> — what each phone costs on the tiered path.</li>
      <li><strong>Trade-in eligibility &amp; values</strong> — what qualifies for the premium trade-in path.</li>
      <li><strong>Product rules &amp; specs</strong> — the fine print behind Fiber, Wireless, VoIP, AIA-B, AWB.</li>
      <li><strong>Per-carrier porting steps</strong> — screenshots and walkthroughs for generating a porting PIN on every major and third-party carrier.</li>
    </ul>

    <h2>Walkthrough</h2>
    <div class="video-wrap"><div style="position: relative; padding-bottom: 56.25%; height: 0;"><iframe src="https://www.loom.com/embed/2eca56aa757a469298abf99f4ee14fd6" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe></div></div>

      <p>This hub deliberately <strong>does not bake in prices, promos, or device specifics</strong> — they go stale the moment AT&amp;T changes them. Instead it teaches the concepts and points you here. If you're ever unsure whether something's current: <strong>Knowledge Plus settles it.</strong></p>

  { id: "porting", label: "Getting the Porting PINs", html: `
    <div class="eyebrow-sm">Software · Porting</div>
    <h1 class="page-h1">Getting the Porting PINs</h1>
    <p class="page-lead">To bring numbers over, you need a porting PIN. How many you need depends on the account type — get this wrong on a multi-line deal and you'll stall mid-order.</p>
    <div class="callout rule"><div class="ttl">The PIN rule</div>
      <p><strong>Business account</strong> → a <strong>unique porting PIN for each line</strong> on the account.</p>
      <p><strong>Consumer account</strong> → <strong>one porting PIN for the entire account.</strong></p>
    </div>
    <h2>Where to get them</h2>
    <ul>
      <li>In the customer's <strong>current carrier's app or website.</strong></li>
      <li>Or <strong>call in</strong> to the carrier to get it.</li>
    </ul>
    <div class="callout"><div class="ttl">The SARA Plus shortcut</div>
      <p>When you reach the <strong>porting page in SARA Plus</strong>, it gives you a <strong>phone number</strong> to call into the customer's carrier (T-Mobile, Verizon, etc.) to retrieve the PIN right there on the call.</p>
    </div>
    <div class="callout warn"><div class="ttl">Third-party carriers</div>
      <p>SARA Plus won't hand you the number for third-party carriers — call their <strong>general customer service line.</strong></p>
    </div>
    <div class="callout source"><div class="ttl">For the step-by-step</div>
      <p><span class="sot">Knowledge Plus</span> has screenshots and walkthroughs for generating a porting PIN on <strong>every major and third-party carrier.</strong> Pull it up live if a customer is stuck.</p>
    </div>
    <div class="qref"><div class="ttl">Quick-ref</div>
      <ul>
        <li><strong>Business = PIN per line. Consumer = one PIN.</strong></li>
        <li>Carrier app/website, or call in — SARA Plus gives you the number on the porting page.</li>
        <li>Third-party → general customer service line.</li>
        <li>Stuck? → Knowledge Plus has per-carrier screenshots.</li>
      </ul>
    </div>
  `},

  { id: "mst", label: "Quoting in AT&amp;T", html: `
    <div class="eyebrow-sm">Software · AT&amp;T MST</div>
    <h1 class="page-h1">Quoting in AT&amp;T MST</h1>
    <p class="page-lead">AT&amp;T MST is where you build the actual quote and send the customer a clean PDF. It's the pricing source of truth.</p>
    <a class="launch-btn" href="https://mst.att.com/auth/login?returnUrl=%2F" target="_blank">Open AT&amp;T MST ↗</a>
    <div class="callout warn"><div class="ttl">Set your role to NDS-B first</div>
      <p>If your role is on "Retail," you'll see the <strong>wrong promotions.</strong> Open the menu, switch your role to <strong>NDS-B</strong>, save, and wait for the reload before you build anything.</p>
    </div>
    <h2>The flow</h2>
    <ol>
      <li>Go to <strong>MST.ATT.com</strong> and log in.</li>
      <li><strong>Quick Quote</strong> → choose <strong>Business</strong> (or Consumer).</li>
      <li>Set role to <strong>NDS-B</strong> → save → reload.</li>
      <li>Add product tabs (focus on <strong>Unlimited</strong> and <strong>Internet</strong>).</li>
      <li>Add devices one by one → Edit Options → pick the service plan → add a Device Buyout Reward Card if it applies.</li>
      <li>Apply <strong>trade-in values</strong> (use the trade-in lookup) and <strong>monthly line credits</strong> (stack appropriately).</li>
      <li><strong>See Review</strong> → confirm totals → download the <strong>PDF</strong> → text/email it to the customer.</li>
      <li><strong>Save the Quote ID</strong> in your notes for retrieval.</li>
    </ol>
    <div class="callout warn"><div class="ttl">Set expectations from AT&amp;T MST</div>
      <p>Trade-in <strong>credits can take 2–3 months</strong> to apply after the trade-in is processed (they backdate). Quote trade-in values accurately — sloppy estimates cause discrepancies later.</p>
    </div>

    <h2>Walkthrough</h2>
    <div class="video-wrap"><div style="position: relative; padding-bottom: 56.25%; height: 0;"><iframe src="https://www.loom.com/embed/fccc4f7220e744d0b2cd2cbd83651ffd" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe></div></div>
    <a class="dl-btn" href="../assets/docs/MST%20Quoting%20SOP.pdf" target="_blank" rel="noopener">⬇ MST Quoting SOP (PDF)</a>
  `},

  { id: "saraplus", label: "Order Entry — SARA Plus", html: `
    <div class="eyebrow-sm">Software · SARA Plus</div>
    <h1 class="page-h1">Order Entry — SARA Plus</h1>
    <p class="page-lead">Once they've said yes, SARA Plus is where the order actually gets built and submitted. The UI shifts over time — the shape of the flow doesn't.</p>
    <a class="launch-btn" href="https://www.saraplus.com/e/ServicePages/Login.aspx" target="_blank">Open SARA Plus ↗</a>

    <h2>The shape (every order)</h2>
    <ol>
      <li><strong>Set up the customer</strong> — log in, select business account / "SBS Strike," choose <em>Non-Present</em> (phone sale).</li>
      <li><strong>Customer details</strong> — legal name, email, business name, Tax ID, business type, address. <em>Account # &amp; IMEIs get collected here.</em></li>
      <li><strong>Verify the business</strong> — Google + Secretary of State; confirm it's active and the name matches.</li>
      <li><strong>Credit check</strong> — read the verbatim, get the "yes." (Sole Prop: collect DOB + SSN/ITIN.)</li>
      <li><strong>ID Authentication</strong> (wireless) — mandatory, no workarounds. See Compliance.</li>
      <li><strong>Build the offer</strong> — products, plans, devices, port info (number, account #, PIN), promotions.</li>
      <li><strong>Finalize</strong> — review for accuracy, set AutoPay, submit, screenshot the confirmation.</li>
    </ol>

    <h2>The four flows</h2>
    <table>
      <tr><th>Flow</th><th>Watch for</th></tr>
      <tr><td><strong>Wireless port-in</strong></td><td>Add port info per line (no dashes in account #), manage Number Lock, add promos.</td></tr>
      <tr><td><strong>Fiber + VoIP + AWB</strong></td><td>Speed grid → voice packages (max 6 VoIP lines) → AWB device (counts toward 10 CRU).</td></tr>
      <tr><td><strong>AIA-B</strong></td><td>Ordered under the <em>Wireless</em> flow even though it's internet; can't process if they already have a business wireless account.</td></tr>
      <tr><td><strong>ID Auth</strong></td><td>Automated (customer scans ID) or Manual (call in). Never use your own number. See Compliance.</td></tr>
    </table>

    <h2>Walkthrough</h2>
    <div class="video-wrap"><div style="position: relative; padding-bottom: 56.25%; height: 0;"><iframe src="https://www.loom.com/embed/def30cfa4e3941debed5e01a64931ee0" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe></div></div>
    <a
  class="dl-btn"
  href="../assets/docs/SARA%20Plus%20Order%20Walkthrough.pdf"
  target="_blank"
  rel="noopener"
>
  ⬇ SARA Plus Order Walkthrough (PDF)
</a>
  `},

    <div class="eyebrow-sm">Software · Clean Intake</div>
    <h1 class="page-h1">Clean Intake — No Manual Review</h1>
    <p class="page-lead">The system is unforgiving about mismatched info. A clean intake closes; a sloppy one triggers manual review — chargeback risk, delayed install, sometimes a dead deal. The close doesn't end at "yes," it ends at "submitted clean."</p>

    <h3>1 · Use the customer's exact name from their driver's license</h3>
    <p>Full middle name (or initial as it appears) goes in the <strong>first name</strong> field. DL says "John Jacob Jingleheimer" → First: <strong>John Jacob</strong>, Last: Jingleheimer. Any drift from the ID is friction during ID Auth and a likely review trigger.</p>

    <h3>2 · Use the exact legal business name from the Secretary of State</h3>
    <p>Customers give you their <em>trade name</em>, which often isn't the registered name. "JJ's Towing" might be "John J Towing Company LLC" on the SOS site. Put the <strong>full legal name</strong> in SARA Plus or you'll trigger a review.</p>

    <h3>3 · Actually do the verification — don't fake your sources</h3>
    <p>The business-verification step asks for 2 sources. <strong>Only pick ones you actually used that actually returned results.</strong> If you get pulled into manual review, the reviewer retraces your exact sources — if Google returns nothing for that business and you picked Google, they fail the order, no questions asked.</p>
    <div class="callout"><div class="ttl">Source priority (when they exist)</div>
      <p><strong>Google + Secretary of State</strong> is ideal — especially if the website lists the same phone number going on the AT&amp;T account (that cross-match is gold). <strong>411.com</strong> is a reliable fail-safe.</p>
    </div>
    <div class="qref"><div class="ttl">Quick-ref</div>
      <ul>
        <li>Name = <strong>exactly</strong> what's on the DL (middle name in the first-name field).</li>
        <li>Business = <strong>exact legal name</strong> from Secretary of State, not the trade name.</li>
        <li>Verification sources = <strong>real ones only.</strong> Never claim a source that returns nothing.</li>
        <li>Account numbers → <strong>strip the dashes.</strong></li>
      </ul>
    </div>

/* ============================ ROUTER ============================ */
let active = { sec: "overview", sub: "home" };

function findSec(id){ return HUB.find(s => s.id === id); }

function renderTopnav(){
  const el = document.getElementById("topnav-links");
  el.innerHTML = HUB.map(s =>
    '<button class="topnav-link' + (s.id===active.sec?' active':'') + '" data-sec="'+s.id+'">'+s.label+'</button>'
  ).join("");
  el.querySelectorAll(".topnav-link").forEach(b =>
    b.onclick = () => { const s = findSec(b.dataset.sec); go(s.id, s.subs[0].id); }
  );
}

function renderSidebar(){
  const sec = findSec(active.sec);
  const sb = document.getElementById("sidebar");
  if (sec.solo){ sb.classList.remove("visible"); return; }
  sb.classList.add("visible");
  document.getElementById("sidebar-title").textContent = sec.label;
  const el = document.getElementById("sidebar-links");
  el.innerHTML = sec.subs.map(s =>
    '<button class="sidebar-link'+(s.id===active.sub?' active':'')+'" data-sub="'+s.id+'">'+s.label+'</button>'
  ).join("");
  el.querySelectorAll(".sidebar-link").forEach(b =>
    b.onclick = () => go(active.sec, b.dataset.sub)
  );
}

function renderContent(){
  const sec = findSec(active.sec);
  const sub = sec.subs.find(x => x.id === active.sub) || sec.subs[0];
  const c = document.getElementById("content");
  c.innerHTML = sub.html;
  c.scrollTop = 0;
  window.scrollTo(0,0);
  // wire overview nav cards
  c.querySelectorAll("[data-go]").forEach(b => {
    b.onclick = () => { const [s,u] = b.dataset.go.split("."); go(s,u); };
  });
}

function go(sec, sub){
  active = { sec, sub };
  location.hash = sec + "/" + sub;
  renderTopnav(); renderSidebar(); renderContent();
}

function bootFromHash(){
  const h = (location.hash || "").replace("#","");
  const [s,u] = h.split("/");
  const sec = findSec(s);
  if (sec){ const sub = sec.subs.find(x=>x.id===u) ? u : sec.subs[0].id; active = {sec:s, sub}; }
}

bootFromHash();
renderTopnav(); renderSidebar(); renderContent();
window.addEventListener("hashchange", () => { bootFromHash(); renderTopnav(); renderSidebar(); renderContent(); });
</script>
