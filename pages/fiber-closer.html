<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiber Closer | Strike</title>
  <link rel="icon" type="image/png" href="../assets/logo/favicon.png">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.82)),
        url("../assets/backgrounds/background.webp") center / cover no-repeat;
      color: #fff;
    }
    main {
      width: min(620px, 100%);
      padding: 42px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(7,8,10,.94);
      text-align: center;
    }
    img { width: min(360px, 82%); margin: 0 auto 26px; }
    h1 { margin: 0 0 12px; text-transform: uppercase; letter-spacing: .055em; }
    p { margin: 0 0 28px; color: #b9bcc2; line-height: 1.6; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border: 1px solid #f11f2d;
      color: #fff;
      background: linear-gradient(#c81d28, #760009);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <img src="../assets/logo/strike-logo.webp" alt="Strike">
